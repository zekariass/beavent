# Local development stack (hosting-neutral). Start with: docker compose up -d
# Ports are bound to localhost only. Credentials here are for local development only.
name: beavent

services:
  postgres:
    # Official PostGIS image is published for amd64 only; on Apple Silicon it runs under emulation.
    # CI uses the same image natively. Pin to the production major version once hosting is chosen.
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_USER: beavent
      POSTGRES_PASSWORD: beavent
      POSTGRES_DB: beavent
    ports: ["127.0.0.1:5433:5432"] # 5433 avoids clashing with a locally installed PostgreSQL on 5432
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beavent -d beavent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: beavent
      RABBITMQ_DEFAULT_PASS: beavent
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  minio:
    # S3-compatible object storage for files and media.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: beavent
      MINIO_ROOT_PASSWORD: beavent-dev-secret
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    # Catches all outgoing email in development: http://localhost:8025
    image: axllent/mailpit:v1.24
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

volumes:
  pgdata:
  miniodata:
