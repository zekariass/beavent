# Local development stack (hosting-neutral). Start with: docker compose up -d
# Ports are bound to localhost only. Credentials here are for local development only.
name: beavent

services:
  postgres:
    # Official PostGIS image is published for amd64 only; on Apple Silicon it runs under emulation.
    # CI uses the same image natively. Pin to the production major version once hosting is chosen.
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_USER: beavent
      POSTGRES_PASSWORD: beavent
      POSTGRES_DB: beavent
    ports: ["127.0.0.1:5433:5432"] # 5433 avoids clashing with a locally installed PostgreSQL on 5432
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beavent -d beavent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: beavent
      RABBITMQ_DEFAULT_PASS: beavent
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20

  seaweedfs:
    # S3-compatible object storage for files and media (local stand-in for Cloudflare R2 / AWS S3).
    # Credentials and the public-read rule for beavent-public: docker/seaweedfs/s3.json.
    image: chrislusf/seaweedfs:4.52
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - seaweeddata:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  mailpit:
    # Catches all outgoing email in development: http://localhost:8025
    image: axllent/mailpit:v1.24
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  chapa-stub:
    # Local stand-in for the Chapa API (tools/chapa-stub). The backend points CHAPA_BASE_URL here in development.
    # Webhooks go to the backend running on the host (./gradlew bootRun on :8080).
    build: ./tools/chapa-stub
    environment:
      PORT: "8090"
      PUBLIC_URL: http://localhost:8090
      WEBHOOK_URL: http://host.docker.internal:8080/v1/hooks/chapa
      CHAPA_SECRET_KEY: CHASECK_TEST-beavent-stub
      CHAPA_WEBHOOK_SECRET: beavent-stub-webhook-secret
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8090:8090"]

volumes:
  pgdata:
  seaweeddata:
