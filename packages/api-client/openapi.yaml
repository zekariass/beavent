        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from /v1/auth/* (ES256, 10 minutes).
  schemas:
    PhoneE164:
      type: string
      pattern: ^\+[1-9][0-9]{6,14}$
      examples:
        - '+251911234567'
    OtpPurpose:
      type: string
      enum:
        - SIGN_IN
        - VERIFY_PHONE
        - STEP_UP
        - CLAIM_GUEST_ORDERS
        - CHANGE_PAYOUT_ACCOUNT
      description: SIGN_IN creates the account on first use (phone-first sign-up).
    OtpChannel:
      type: string
      enum:
        - SMS
        - TELEGRAM
        - WHATSAPP
        - VOICE
    ClientApp:
      type: string
      enum:
        - MOBILE_APP
        - WEB_MARKETPLACE
        - PARTNER_PORTAL
        - ADMIN_CONSOLE
    LanguageCode:
      type: string
      description: BCP 47 language code (am, om, ti, so, en, sw, ...).
      examples:
        - am
    OtpRequest:
      type: object
      required:
        - phone
        - purpose
        - clientApp
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
        channel:
          allOf:
            - $ref: '#/components/schemas/OtpChannel'
          default: SMS
        clientApp:
          $ref: '#/components/schemas/ClientApp'
        language:
          $ref: '#/components/schemas/LanguageCode'
    Uuid:
      type: string
      format: uuid
    Instant:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    OtpChallenge:
      type: object
      required:
        - challengeId
        - expiresAt
        - resendAfter
        - channel
      properties:
        challengeId:
          $ref: '#/components/schemas/Uuid'
        expiresAt:
          $ref: '#/components/schemas/Instant'
        resendAfter:
          $ref: '#/components/schemas/Instant'
        channel:
          $ref: '#/components/schemas/OtpChannel'
        codeLength:
          type: integer
          examples:
            - 6
    Problem:
      type: object
      description: RFC 9457 problem details with Beavent's stable `code`.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
          examples:
            - urn:beavent:problem:slot-taken
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
          description: The request path that produced this problem.
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - FORBIDDEN
            - STEP_UP_REQUIRED
            - NOT_FOUND
            - CONFLICT
            - SLOT_TAKEN
            - SOLD_OUT
            - IMMUTABLE
            - CONCURRENT_UPDATE
            - IDEMPOTENCY_IN_PROGRESS
            - PRECONDITION_FAILED
            - IDEMPOTENCY_KEY_REUSED
            - REFERENCE_NOT_FOUND
            - CONSTRAINT_VIOLATION
            - PRECONDITION_REQUIRED
            - RATE_LIMITED
            - INTERNAL
        requestId:
          type: string
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
    DeviceInfo:
      type: object
      required:
        - installationId
        - platform
      properties:
        installationId:
          type: string
          maxLength: 200
        platform:
          type: string
          enum:
            - IOS
            - ANDROID
            - WEB
        appVersion:
          type: string
          maxLength: 40
    OtpVerify:
      type: object
      required:
        - challengeId
        - code
      properties:
        challengeId:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          pattern: ^[0-9]{4,8}$
        device:
          $ref: '#/components/schemas/DeviceInfo'
    CountryCode:
      type: string
      pattern: ^[A-Z]{2}$
      examples:
        - ET
    Membership:
      type: object
      required:
        - orgId
        - orgName
        - orgSlug
        - roleCode
        - roleName
        - isOwner
        - capabilities
      properties:
        orgId:
          $ref: '#/components/schemas/Uuid'
        orgName:
          type: string
        orgSlug:
          type: string
        roleCode:
          type: string
        roleName:
          type: string
        isOwner:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
    Me:
      type: object
      required:
        - id
        - status
        - phoneVerified
        - emailVerified
        - mfaEnabled
        - memberships
        - isPlatformStaff
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        phone:
          $ref: '#/components/schemas/PhoneE164'
        phoneVerified:
          type: boolean
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        status:
          type: string
          enum:
            - PENDING
            - ACTIVE
            - LOCKED
            - SUSPENDED
            - CLOSED
        firstName:
          type: string
        lastName:
          type: string
          description: In Ethiopia usually the father's name; never required.
        displayName:
          type: string
        avatarFileId:
          $ref: '#/components/schemas/Uuid'
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        preferredLanguage:
          $ref: '#/components/schemas/LanguageCode'
        displayCalendar:
          type: string
          enum:
            - GREGORIAN
            - ETHIOPIAN
        timezone:
          type: string
        mfaEnabled:
          type: boolean
        hasPassword:
          type: boolean
        isPlatformStaff:
          type: boolean
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    Tokens:
      type: object
      required:
        - result
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
        - user
        - isNewUser
      properties:
        result:
          type: string
          const: TOKENS
        accessToken:
          type: string
        accessTokenExpiresAt:
          $ref: '#/components/schemas/Instant'
        refreshToken:
          type: string
          description: Opaque; rotated on every refresh. Reusing an old one revokes the whole session family.
        refreshTokenExpiresAt:
          $ref: '#/components/schemas/Instant'
        isNewUser:
          type: boolean
        user:
          $ref: '#/components/schemas/Me'
    MfaRequired:
      type: object
      required:
        - result
        - mfaChallengeId
        - methods
      properties:
        result:
          type: string
          const: MFA_REQUIRED
        mfaChallengeId:
          $ref: '#/components/schemas/Uuid'
        methods:
          type: array
          items:
            type: string
            enum:
              - TOTP
              - SMS
    AuthResult:
      description: Either tokens, or a second factor is required first.
      oneOf:
        - $ref: '#/components/schemas/Tokens'
        - $ref: '#/components/schemas/MfaRequired'
      discriminator:
        propertyName: result
        mapping:
          TOKENS: '#/components/schemas/Tokens'
          MFA_REQUIRED: '#/components/schemas/MfaRequired'
    PasswordLogin:
      type: object
      required:
        - identifier
        - password
        - clientApp
      properties:
        identifier:
          type: string
          description: Phone number (E.164) or email.
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 256
        clientApp:
          $ref: '#/components/schemas/ClientApp'
        device:
          $ref: '#/components/schemas/DeviceInfo'
    OAuthLogin:
      type: object
      required:
        - idToken
        - nonce
        - clientApp
      properties:
        idToken:
          type: string
          description: ID token from Google or Apple, verified server-side (issuer, audience, signature, nonce).
        nonce:
          type: string
        clientApp:
          $ref: '#/components/schemas/ClientApp'
        device:
          $ref: '#/components/schemas/DeviceInfo'
    MfaVerify:
      type: object
      required:
        - mfaChallengeId
        - code
      properties:
        mfaChallengeId:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          pattern: ^[0-9]{6}$
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          format: password
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          format: password
          description: Revokes this session; omit to revoke the session of the access token.
        allSessions:
          type: boolean
          default: false
    StepUpRequest:
      type: object
      required:
        - method
        - code
      properties:
        method:
          type: string
          enum:
            - OTP
            - TOTP
        challengeId:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          pattern: ^[0-9]{4,8}$
    Jwks:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: true
    MeUpdate:
      type: object
      minProperties: 1
      properties:
        firstName:
          type:
            - string
            - 'null'
          maxLength: 100
        lastName:
          type:
            - string
            - 'null'
          maxLength: 100
        displayName:
          type:
            - string
            - 'null'
          maxLength: 100
        email:
          type:
            - string
            - 'null'
          format: email
          description: Changing the email starts a verification.
        avatarFileId:
          type:
            - string
            - 'null'
          format: uuid
        preferredLanguage:
          $ref: '#/components/schemas/LanguageCode'
        displayCalendar:
          type: string
          enum:
            - GREGORIAN
            - ETHIOPIAN
        timezone:
          type: string
    PasswordChange:
      type: object
      required:
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          description: Required when a password is already set (step-up token also accepted).
        newPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 256
    TotpEnrollment:
      type: object
      required:
        - factorId
        - otpauthUri
        - secret
      properties:
        factorId:
          $ref: '#/components/schemas/Uuid'
        otpauthUri:
          type: string
        secret:
          type: string
          description: Base32; shown once.
    TotpConfirm:
      type: object
      required:
        - factorId
        - code
      properties:
        factorId:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          pattern: ^[0-9]{6}$
    Session:
      type: object
      required:
        - id
        - clientApp
        - createdAt
        - current
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        clientApp:
          $ref: '#/components/schemas/ClientApp'
        deviceLabel:
          type: string
        ipAddress:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
        lastUsedAt:
          $ref: '#/components/schemas/Instant'
        current:
          type: boolean
    SessionList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    DeviceRegistration:
      type: object
      required:
        - installationId
        - platform
      properties:
        installationId:
          type: string
          maxLength: 200
        platform:
          type: string
          enum:
            - IOS
            - ANDROID
            - WEB
        pushToken:
          type: string
          maxLength: 4096
        appVersion:
          type: string
        locale:
          type: string
    ConsentAcceptance:
      type: object
      required:
        - documentVersionIds
      properties:
        documentVersionIds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Uuid'
    OrganizationKind:
      type: string
      enum:
        - BUSINESS
        - INDEPENDENT_PROFESSIONAL
        - EVENT_ORGANIZER
        - VENUE_OPERATOR
        - NON_PROFIT
        - COMMUNITY_GROUP
    Capability:
      type: string
      enum:
        - APPOINTMENTS
        - CLASSES
        - EVENTS
        - RESERVED_SEATING
        - RETAIL
        - ONLINE_STORE
        - AT_HOME_SERVICES
        - GIFT_CARDS
        - MEMBERSHIPS
        - PACKAGES
        - LOYALTY
        - MARKETING
        - TEAM_PAY
        - AI_CONCIERGE
        - BOX_OFFICE
        - PUBLIC_API
    OrganizationCreate:
      type: object
      required:
        - displayName
        - kind
        - primaryCategoryId
        - defaultLanguage
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])?$
          description: Generated from the name when omitted.
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        primaryCategoryId:
          $ref: '#/components/schemas/Uuid'
        marketCode:
          type: string
          default: ET
        defaultLanguage:
          $ref: '#/components/schemas/LanguageCode'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
    LocalizedText:
      type: object
      description: Text per language code; clients fall back user language → organization default → market default → en.
      additionalProperties:
        type: string
      examples:
        - en: Hair
          am: ፀጉር
    Organization:
      type: object
      required:
        - id
        - slug
        - displayName
        - kind
        - status
        - verificationStatus
        - marketplaceStatus
        - marketCode
        - defaultLanguage
        - capabilities
        - version
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          type: string
        displayName:
          type: string
        kind:
          $ref: '#/components/schemas/OrganizationKind'
        primaryCategoryId:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum:
            - ONBOARDING
            - ACTIVE
            - RESTRICTED
            - SUSPENDED
            - CLOSED
        verificationStatus:
          type: string
          enum:
            - UNVERIFIED
            - PENDING
            - VERIFIED
            - REJECTED
        marketplaceStatus:
          type: string
          enum:
            - HIDDEN
            - PENDING_REVIEW
            - LISTED
            - DELISTED
        marketCode:
          type: string
        descriptionI18n:
          $ref: '#/components/schemas/LocalizedText'
        logoFileId:
          $ref: '#/components/schemas/Uuid'
        coverFileId:
          $ref: '#/components/schemas/Uuid'
        websiteUrl:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        socialLinks:
          type: object
          additionalProperties:
            type: string
        defaultLanguage:
          $ref: '#/components/schemas/LanguageCode'
        capabilities:
          type: array
          items:
            $ref: '#/components/schemas/Capability'
        createdAt:
          $ref: '#/components/schemas/Instant'
        version:
          type: integer
          description: Same value as the ETag.
    OrganizationUpdate:
      type: object
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 120
        descriptionI18n:
          $ref: '#/components/schemas/LocalizedText'
        logoFileId:
          type:
            - string
            - 'null'
          format: uuid
        coverFileId:
          type:
            - string
            - 'null'
          format: uuid
        websiteUrl:
          type:
            - string
            - 'null'
          format: uri
        contactEmail:
          type:
            - string
            - 'null'
          format: email
        contactPhone:
          oneOf:
            - $ref: '#/components/schemas/PhoneE164'
            - type: 'null'
        socialLinks:
          type: object
          additionalProperties:
            type: string
        defaultLanguage:
          $ref: '#/components/schemas/LanguageCode'
    CapabilitiesUpdate:
      type: object
      required:
        - capabilities
      properties:
        capabilities:
          type: array
          description: The full desired set; plan entitlements may restrict it.
          items:
            $ref: '#/components/schemas/Capability'
    GeoPoint:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    Address:
      type: object
      description: Landmark-first address (most addresses in the launch markets have no postal code).
      required:
        - countryCode
      properties:
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        adminAreaId:
          $ref: '#/components/schemas/Uuid'
        addressLine:
          type: string
          maxLength: 300
        landmark:
          type: string
          maxLength: 300
          examples:
            - Behind Edna Mall, 2nd gate
        city:
          type: string
          maxLength: 120
        postalCode:
          type: string
          maxLength: 20
        geo:
          $ref: '#/components/schemas/GeoPoint'
    LegalEntityInput:
      type: object
      required:
        - countryCode
        - entityType
        - registeredName
        - taxRegime
      properties:
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        entityType:
          type: string
          enum:
            - SOLE_PROPRIETOR
            - PLC
            - SHARE_COMPANY
            - PARTNERSHIP
            - NGO
            - INDIVIDUAL
            - OTHER
        registeredName:
          type: string
          maxLength: 200
        tradeLicenseNumber:
          type: string
          maxLength: 60
        tin:
          type: string
          maxLength: 30
          description: Taxpayer identification number.
        vatNumber:
          type: string
          maxLength: 30
          description: Required when taxRegime is VAT.
        taxRegime:
          type: string
          enum:
            - VAT
            - TOT
            - PRESUMPTIVE
            - EXEMPT
        registeredAddress:
          $ref: '#/components/schemas/Address'
        isDefault:
          type: boolean
    CurrencyCode:
      type: string
      pattern: ^[A-Z]{3}$
      examples:
        - ETB
    LegalEntity:
      allOf:
        - $ref: '#/components/schemas/LegalEntityInput'
        - type: object
          required:
            - id
            - functionalCurrency
            - verificationStatus
            - isDefault
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            functionalCurrency:
              $ref: '#/components/schemas/CurrencyCode'
            verificationStatus:
              type: string
              enum:
                - UNVERIFIED
                - PENDING
                - VERIFIED
                - REJECTED
    LegalEntityList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LegalEntity'
    OpeningHours:
      type: object
      required:
        - isoWeekday
        - opensAt
        - closesAt
      properties:
        isoWeekday:
          type: integer
          minimum: 1
          maximum: 7
        opensAt:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        closesAt:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
    LocationInput:
      type: object
      required:
        - name
        - legalEntityId
        - address
        - timezone
      properties:
        name:
          type: string
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
        legalEntityId:
          $ref: '#/components/schemas/Uuid'
        address:
          $ref: '#/components/schemas/Address'
        timezone:
          type: string
          examples:
            - Africa/Addis_Ababa
        phone:
          $ref: '#/components/schemas/PhoneE164'
        email:
          type: string
          format: email
        serviceMode:
          type: string
          enum:
            - ON_PREMISES
            - MOBILE_ONLY
            - BOTH
          default: ON_PREMISES
        onlineBooking:
          type: boolean
          default: true
        hours:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHours'
    Location:
      allOf:
        - $ref: '#/components/schemas/LocationInput'
        - type: object
          required:
            - id
            - slug
            - currency
            - status
            - marketplaceListed
            - version
          properties:
            id:
              $ref: '#/components/schemas/Uuid'
            placeId:
              $ref: '#/components/schemas/Uuid'
            currency:
              $ref: '#/components/schemas/CurrencyCode'
            status:
              type: string
              enum:
                - ACTIVE
                - INACTIVE
                - ARCHIVED
            marketplaceListed:
              type: boolean
            version:
              type: integer
    PageInfo:
      type: object
      required:
        - nextCursor
      properties:
        nextCursor:
          type:
            - string
            - 'null'
          description: Pass as `cursor` to get the next page; null on the last page.
    LocationList:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        page:
          $ref: '#/components/schemas/PageInfo'
    Role:
      type: object
      required:
        - id
        - code
        - name
        - isSystem
        - permissions
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
        name:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
          description: System templates are read-only; clone them to customise.
        permissions:
          type: array
          items:
            type: string
    RoleList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Role'
    RoleCreate:
      type: object
      required:
        - name
        - permissions
      properties:
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 300
        basedOnRoleId:
          $ref: '#/components/schemas/Uuid'
        permissions:
          type: array
          items:
            type: string
    RoleUpdate:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 80
        description:
          type: string
          maxLength: 300
        permissions:
          type: array
          items:
            type: string
    Member:
      type: object
      required:
        - id
        - userId
        - displayName
        - roleId
        - roleCode
        - status
        - isOwner
        - allLocations
        - locationIds
        - joinedAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        userId:
          $ref: '#/components/schemas/Uuid'
        displayName:
          type: string
        phone:
          $ref: '#/components/schemas/PhoneE164'
        roleId:
          $ref: '#/components/schemas/Uuid'
        roleCode:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
            - REMOVED
        isOwner:
          type: boolean
        allLocations:
          type: boolean
        locationIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        joinedAt:
          $ref: '#/components/schemas/Instant'
    MemberList:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        page:
          $ref: '#/components/schemas/PageInfo'
    MemberUpdate:
      type: object
      minProperties: 1
      properties:
        roleId:
          $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum:
            - ACTIVE
            - SUSPENDED
        allLocations:
          type: boolean
        locationIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
    Invitation:
      type: object
      required:
        - id
        - roleId
        - status
        - expiresAt
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        phone:
          $ref: '#/components/schemas/PhoneE164'
        email:
          type: string
        roleId:
          $ref: '#/components/schemas/Uuid'
        locationIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
        status:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - REVOKED
            - EXPIRED
        expiresAt:
          $ref: '#/components/schemas/Instant'
        createdAt:
          $ref: '#/components/schemas/Instant'
    InvitationList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
    InvitationCreate:
      type: object
      required:
        - roleId
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'
        email:
          type: string
          format: email
        roleId:
          $ref: '#/components/schemas/Uuid'
        locationIds:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
      anyOf:
        - required:
            - phone
        - required:
            - email
    InvitationAccept:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: From the invitation link sent by SMS or email.
    VerificationDocumentInput:
      type: object
      required:
        - docType
        - fileId
      properties:
        docType:
          type: string
          enum:
            - TRADE_LICENSE
            - TIN_CERTIFICATE
            - VAT_CERTIFICATE
            - NATIONAL_ID
            - FAYDA_ID
            - PASSPORT
            - KEBELE_ID
            - BANK_LETTER
            - PROFESSIONAL_LICENSE
            - VENUE_PERMIT
            - MEMORANDUM_OF_ASSOCIATION
        fileId:
          $ref: '#/components/schemas/Uuid'
        expiresOn:
          type: string
          format: date
    VerificationCase:
      type: object
      required:
        - id
        - subject
        - status
        - createdAt
        - documents
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        subject:
          type: string
        status:
          type: string
          enum:
            - OPEN
            - AWAITING_INFO
            - IN_REVIEW
            - APPROVED
            - REJECTED
            - EXPIRED
        decisionReason:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
        decidedAt:
          $ref: '#/components/schemas/Instant'
        documents:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/VerificationDocumentInput'
              - type: object
                required:
                  - id
                  - status
                properties:
                  id:
                    $ref: '#/components/schemas/Uuid'
                  status:
                    type: string
                    enum:
                      - SUBMITTED
                      - ACCEPTED
                      - REJECTED
    VerificationCaseList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VerificationCase'
    VerificationCaseCreate:
      type: object
      required:
        - subject
        - documents
      properties:
        subject:
          type: string
          enum:
            - ORGANIZATION_KYB
            - OWNER_KYC
        legalEntityId:
          $ref: '#/components/schemas/Uuid'
        documents:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VerificationDocumentInput'
    Market:
      type: object
      required:
        - code
        - countryCode
        - name
        - status
        - defaultCurrency
        - defaultLanguage
        - defaultTimezone
        - languages
        - currencies
      properties:
        code:
          type: string
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        name:
          type: string
        status:
          type: string
          enum:
            - PLANNED
            - PILOT
            - LIVE
            - PAUSED
            - RETIRED
        defaultCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        defaultLanguage:
          $ref: '#/components/schemas/LanguageCode'
        defaultTimezone:
          type: string
        displayCalendar:
          type: string
          enum:
            - GREGORIAN
            - ETHIOPIAN
        localTimeConvention:
          type: string
          enum:
            - STANDARD
            - ETHIOPIAN
        pricesIncludeTax:
          type: boolean
        languages:
          type: array
          items:
            type: object
            required:
              - code
              - isDefault
              - status
            properties:
              code:
                $ref: '#/components/schemas/LanguageCode'
              isDefault:
                type: boolean
              status:
                type: string
                enum:
                  - ENABLED
                  - BETA
        currencies:
          type: array
          items:
            type: object
            required:
              - code
              - minorUnits
              - canPrice
              - canPresent
            properties:
              code:
                $ref: '#/components/schemas/CurrencyCode'
              minorUnits:
                type: integer
              canPrice:
                type: boolean
              canPresent:
                type: boolean
        features:
          type: object
          additionalProperties:
            type: string
            enum:
              - DISABLED
              - BETA
              - ENABLED
    MarketList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Market'
    Language:
      type: object
      required:
        - code
        - englishName
        - nativeName
        - script
        - direction
      properties:
        code:
          $ref: '#/components/schemas/LanguageCode'
        englishName:
          type: string
        nativeName:
          type: string
        script:
          type: string
        direction:
          type: string
          enum:
            - LTR
            - RTL
    LanguageList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Language'
    Category:
      type: object
      required:
        - id
        - kind
        - vertical
        - code
        - name
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        parentId:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum:
            - BUSINESS
            - SERVICE
            - EVENT
            - PRODUCT
        vertical:
          type: string
        code:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedText'
        icon:
          type: string
    CategoryList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    AdminArea:
      type: object
      required:
        - id
        - countryCode
        - level
        - levelName
        - name
        - path
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        parentId:
          $ref: '#/components/schemas/Uuid'
        level:
          type: integer
        levelName:
          type: string
          examples:
            - SUB_CITY
        code:
          type: string
        name:
          type: string
        nameI18n:
          $ref: '#/components/schemas/LocalizedText'
        path:
          type: string
          examples:
            - ET.AA.BOLE
    AdminAreaList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminArea'
    Permission:
      type: object
      required:
        - code
        - module
        - description
        - isSensitive
      properties:
        code:
          type: string
          examples:
            - appointments.manage
        module:
          type: string
        description:
          type: string
        isSensitive:
          type: boolean
          description: Requires MFA / step-up.
    PermissionList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limited; retry after the `Retry-After` header.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Not allowed for this person, organization or permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NoContent:
      description: Done.
    Conflict:
      description: Conflicts with existing data.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Breaks a business rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found (also returned when the resource belongs to another organization).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: The resource changed since it was read (If-Match did not match).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the version being updated.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 1024
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
