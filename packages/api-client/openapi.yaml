        - name
        - status
        - defaultCurrency
        - defaultLanguage
        - defaultTimezone
        - languages
        - currencies
      properties:
        code:
          type: string
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        name:
          type: string
        status:
          type: string
          enum:
            - PLANNED
            - PILOT
            - LIVE
            - PAUSED
            - RETIRED
        defaultCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        defaultLanguage:
          $ref: '#/components/schemas/LanguageCode'
        defaultTimezone:
          type: string
        displayCalendar:
          type: string
          enum:
            - GREGORIAN
            - ETHIOPIAN
        localTimeConvention:
