components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from /v1/auth/* (ES256, 10 minutes).
  schemas:
    PhoneE164:
      type: string
      pattern: ^\+[1-9][0-9]{6,14}$
      examples:
        - '+251911234567'
    OtpPurpose:
      type: string
      enum:
        - SIGN_IN
        - VERIFY_PHONE
        - STEP_UP
        - CLAIM_GUEST_ORDERS
        - CHANGE_PAYOUT_ACCOUNT
      description: SIGN_IN creates the account on first use (phone-first sign-up).
    OtpChannel:
      type: string
      enum:
        - SMS
        - TELEGRAM
        - WHATSAPP
        - VOICE
        - EMAIL
    ClientApp:
      type: string
      enum:
        - MOBILE_APP
        - WEB_MARKETPLACE
        - PARTNER_PORTAL
        - ADMIN_CONSOLE
    LanguageCode:
      type: string
      description: BCP 47 language code (am, om, ti, so, en, sw, ...).
      examples:
        - am
    OtpRequest:
      type: object
      description: Send a one-time code to a phone (SMS, Telegram, WhatsApp, voice) or to an email address (channel EMAIL).
      required:
        - purpose
        - clientApp
      oneOf:
        - required:
            - phone
        - required:
            - email
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'
        email:
          type: string
          format: email
          maxLength: 200
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
        channel:
          allOf:
            - $ref: '#/components/schemas/OtpChannel'
          description: Defaults to SMS for phones and EMAIL for email addresses.
        clientApp:
          $ref: '#/components/schemas/ClientApp'
        language:
          $ref: '#/components/schemas/LanguageCode'
    Uuid:
      type: string
      format: uuid
    Instant:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    OtpChallenge:
      type: object
      required:
        - challengeId
        - expiresAt
        - resendAfter
        - channel
      properties:
        challengeId:
          $ref: '#/components/schemas/Uuid'
        expiresAt:
          $ref: '#/components/schemas/Instant'
        resendAfter:
          $ref: '#/components/schemas/Instant'
        channel:
          $ref: '#/components/schemas/OtpChannel'
        codeLength:
          type: integer
          examples:
            - 6
    Problem:
      type: object
      description: RFC 9457 problem details with Beavent's stable `code`.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
          examples:
            - urn:beavent:problem:slot-taken
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
          description: The request path that produced this problem.
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - FORBIDDEN
            - STEP_UP_REQUIRED
            - NOT_FOUND
            - CONFLICT
            - SLOT_TAKEN
            - HOLD_EXPIRED
            - SOLD_OUT
            - IMMUTABLE
            - CONCURRENT_UPDATE
            - IDEMPOTENCY_IN_PROGRESS
            - PRECONDITION_FAILED
            - IDEMPOTENCY_KEY_REUSED
            - REFERENCE_NOT_FOUND
            - CONSTRAINT_VIOLATION
            - PRECONDITION_REQUIRED
            - RATE_LIMITED
            - INTERNAL
        requestId:
          type: string
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
    DeviceInfo:
      type: object
      required:
        - installationId
        - platform
      properties:
        installationId:
          type: string
          maxLength: 200
        platform:
          type: string
          enum:
            - IOS
            - ANDROID
            - WEB
        appVersion:
          type: string
          maxLength: 40
    OtpVerify:
      type: object
      required:
        - challengeId
        - code
      properties:
        challengeId:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          pattern: ^[0-9]{4,8}$
        device:
          $ref: '#/components/schemas/DeviceInfo'
    CountryCode:
      type: string
      pattern: ^[A-Z]{2}$
      examples:
        - ET
    Membership:
      type: object
      required:
        - orgId
        - orgName
        - orgSlug
        - roleCode
        - roleName
        - isOwner
        - capabilities
      properties:
        orgId:
          $ref: '#/components/schemas/Uuid'
        orgName:
          type: string
        orgSlug:
          type: string
        roleCode:
          type: string
        roleName:
          type: string
        isOwner:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
    Me:
      type: object
      required:
        - id
        - status
        - phoneVerified
        - emailVerified
        - memberships
        - isPlatformStaff
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        phone:
          $ref: '#/components/schemas/PhoneE164'
        phoneVerified:
          type: boolean
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        status:
          type: string
          enum:
            - PENDING
            - ACTIVE
            - LOCKED
            - SUSPENDED
            - CLOSED
        firstName:
          type: string
        lastName:
          type: string
          description: In Ethiopia usually the father's name; never required.
        displayName:
          type: string
        avatarFileId:
          $ref: '#/components/schemas/Uuid'
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        preferredLanguage:
          $ref: '#/components/schemas/LanguageCode'
        displayCalendar:
          type: string
          enum:
            - GREGORIAN
            - ETHIOPIAN
        timezone:
          type: string
        isPlatformStaff:
          type: boolean
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
    Tokens:
      type: object
      required:
        - result
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
        - user
        - isNewUser
      properties:
        result:
          type: string
          const: TOKENS
        accessToken:
          type: string
        accessTokenExpiresAt:
          $ref: '#/components/schemas/Instant'
        refreshToken:
          type: string
          description: Opaque; rotated on every refresh. Reusing an old one revokes the whole session family.
        refreshTokenExpiresAt:
          $ref: '#/components/schemas/Instant'
        isNewUser:
          type: boolean
        user:
          $ref: '#/components/schemas/Me'
    OAuthLogin:
      type: object
      required:
        - idToken
        - nonce
        - clientApp
      properties:
        idToken:
          type: string
          description: ID token from Google or Apple, verified server-side (issuer, audience, signature, nonce).
        nonce:
          type: string
        clientApp:
          $ref: '#/components/schemas/ClientApp'
        device:
          $ref: '#/components/schemas/DeviceInfo'
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          format: password
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          format: password
          description: Revokes this session; omit to revoke the session of the access token.
        allSessions:
          type: boolean
          default: false
    StepUpRequest:
      type: object
      description: A fresh one-time code (purpose STEP_UP, sent to the account's phone or email) before a sensitive action.
      required:
        - challengeId
        - code
      properties:
        challengeId:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          pattern: ^[0-9]{4,8}$
    Jwks:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: true
    MeUpdate:
      type: object
      minProperties: 1
      properties:
        firstName:
          type:
            - string
            - 'null'
          maxLength: 100
        lastName:
          type:
            - string
            - 'null'
          maxLength: 100
        displayName:
          type:
            - string
            - 'null'
          maxLength: 100
        email:
          type:
            - string
            - 'null'
          format: email
          description: Changing the email starts a verification.
        avatarFileId:
          type:
            - string
            - 'null'
          format: uuid
        preferredLanguage:
          $ref: '#/components/schemas/LanguageCode'
        displayCalendar:
          type: string
          enum:
            - GREGORIAN
            - ETHIOPIAN
        timezone:
          type: string
    Session:
      type: object
      required:
        - id
        - clientApp
        - createdAt
        - current
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        clientApp:
          $ref: '#/components/schemas/ClientApp'
        deviceLabel:
          type: string
        ipAddress:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
        lastUsedAt:
          $ref: '#/components/schemas/Instant'
        current:
          type: boolean
    SessionList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    DeviceRegistration:
      type: object
      required:
        - installationId
        - platform
      properties:
        installationId:
          type: string
          maxLength: 200
        platform:
          type: string
          enum:
            - IOS
            - ANDROID
            - WEB
        pushToken:
          type: string
          maxLength: 4096
        appVersion:
          type: string
        locale:
          type: string
    ConsentAcceptance:
      type: object
      required:
        - documentVersionIds
      properties:
        documentVersionIds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Uuid'
    OrganizationKind:
      type: string
      enum:
        - BUSINESS
        - INDEPENDENT_PROFESSIONAL
        - EVENT_ORGANIZER
        - VENUE_OPERATOR
        - NON_PROFIT
        - COMMUNITY_GROUP
    Capability:
      type: string
      enum:
        - APPOINTMENTS
        - CLASSES
        - EVENTS
        - RESERVED_SEATING
        - RETAIL
        - ONLINE_STORE
        - AT_HOME_SERVICES
        - GIFT_CARDS
        - MEMBERSHIPS
        - PACKAGES
        - LOYALTY
        - MARKETING
        - TEAM_PAY
        - AI_CONCIERGE
