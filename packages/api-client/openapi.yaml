        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/orgs/{orgId}/appointments/{appointmentId}/cancel:
    post:
      tags:
        - Calendar
      operationId: cancelAtTheDesk
      summary: Cancel a visit, the rest of its series, or its whole group (no fee; the business cancels)
      description: |
        `scope` ONE (default), FOLLOWING (this and the later visits of the series; the customer gets one message) or GROUP.
        Booked visits that have not started can be cancelled. The times are freed at once.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/AppointmentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  enum:
                    - ONE
                    - FOLLOWING
                    - GROUP
                reason:
                  type: string
                  maxLength: 500
                notifyCustomer:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                type: object
                required:
                  - cancelled
                properties:
                  cancelled:
                    type: array
                    items:
                      $ref: '#/components/schemas/Uuid'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/orgs/{orgId}/appointments/{appointmentId}/payment-link:
    post:
      tags:
        - Calendar
      operationId: sendPaymentLink
      summary: Ask the customer to pay by a link sent to them (a phone booking's deposit, a fresh deposit link, or the balance)
      description: |
        A confirmed booking without an order (a phone booking) is asked for the deposit its policy sets and is held until the
        link runs out (24 hours, or until a quarter of an hour before the visit). A booking waiting for its deposit gets a
        fresh link (the earlier one stops working). A confirmed booking with a balance gets a link for the balance (7 days).
        The customer gets the link by text message (by email without a phone number); the address is returned so it can also be
        shared by hand. `CONFLICT` when nothing is due, the client has neither phone nor email, the business asks for no
        deposit, or the visit is too close; `PAYMENT_UNAVAILABLE` when the business cannot take online payments yet.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/AppointmentIdParam'
      responses:
        '200':
          description: The link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkSent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/orgs/{orgId}/appointments/{appointmentId}/move:
    post:
      tags:
        - Calendar
      operationId: moveAppointment
      summary: Move an appointment to another time (and optionally another person); prices stay as booked
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/AppointmentIdParam'
      requestBody:
        required: true
        content:
