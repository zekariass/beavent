            - string
            - 'null'
          description: How the customer paid (the payment method code).
        bookingReference:
          type:
            - string
            - 'null'
        createdAt:
          $ref: '#/components/schemas/Instant'
        paidAt:
          $ref: '#/components/schemas/Instant'
        reference:
          type:
            - string
            - 'null'
        note:
          type:
            - string
            - 'null'
    RefundSummaryPage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RefundSummary'
        page:
          $ref: '#/components/schemas/PageInfo'
    RefundApproval:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
    RefundPayment:
      type: object
      required:
        - reference
      properties:
        reference:
          type: string
