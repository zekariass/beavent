          $ref: '#/components/schemas/Instant'
        items:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: object
            required:
              - variantId
              - staffId
            properties:
              variantId:
                $ref: '#/components/schemas/Uuid'
              staffId:
                $ref: '#/components/schemas/Uuid'
              addonIds:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/Uuid'
        customer:
          type: object
          description: An existing customer (`customerId`) or a new one (`name`, optional `phone`; a known phone is reused).
          properties:
            customerId:
              $ref: '#/components/schemas/Uuid'
            name:
              type: string
              maxLength: 120
            phone:
              $ref: '#/components/schemas/PhoneE164'
        note:
          type: string
          maxLength: 500
          description: For the team only.
        source:
          type: string
          enum:
            - WALK_IN
            - PHONE
          default: WALK_IN
        bookAnyway:
          type: boolean
          default: false
        notifyCustomer:
          type: boolean
          default: true
        guests:
          type: array
          maxItems: 9
          description: |
            A group: more people at the same time, one appointment each, booked all together or not at all (the first
            customer leads the group). Not with `repeat`.
          items:
            type: object
            required:
              - customer
              - items
            properties:
              customer:
                $ref: '#/components/schemas/customer'
              items:
                $ref: '#/components/schemas/items'
        repeat:
          type: object
          description: |
            A series: the same visit every `everyWeeks` weeks, `count` times in all, at the same local time. Only the first
            visit sends a confirmation; reminders follow each. Not with `guests`.
          required:
            - everyWeeks
            - count
          properties:
            everyWeeks:
              type: integer
              minimum: 1
              maximum: 4
            count:
              type: integer
              minimum: 2
              maximum: 12
        skipTaken:
          type: boolean
          description: In a series, leave out the dates that are not free instead of failing (false when absent).
