components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from /v1/auth/* (ES256, 10 minutes).
  schemas:
    HookReceipt:
      type: object
      required:
        - received
      properties:
        received:
          type: boolean
    Bank:
      type: object
      required:
        - code
        - kind
        - names
      properties:
        code:
          type: string
          description: What a payout account stores as its institution.
        kind:
          type: string
          enum:
            - BANK
            - MOBILE_MONEY
        names:
          type: object
          additionalProperties:
            type: string
          description: The name per language (`en`, `am`).
    BankList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Bank'
    Problem:
      type: object
      description: RFC 9457 problem details with Beavent's stable `code`.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
          examples:
            - urn:beavent:problem:slot-taken
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
          description: The request path that produced this problem.
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - FORBIDDEN
            - STEP_UP_REQUIRED
            - NOT_FOUND
            - CONFLICT
            - SLOT_TAKEN
            - HOLD_EXPIRED
            - SOLD_OUT
            - IMMUTABLE
            - CONCURRENT_UPDATE
            - IDEMPOTENCY_IN_PROGRESS
            - PRECONDITION_FAILED
            - IDEMPOTENCY_KEY_REUSED
            - REFERENCE_NOT_FOUND
            - CONSTRAINT_VIOLATION
            - PATCH_TEST_REQUIRED
            - PRECONDITION_REQUIRED
            - RATE_LIMITED
            - PAYMENT_UNAVAILABLE
            - INTERNAL
        requestId:
          type: string
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
    Uuid:
      type: string
      format: uuid
    Instant:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    PayoutAccount:
      type: object
      description: A payout account as screens show it. The number is only ever masked.
      required:
        - id
        - kind
        - institutionCode
        - institutionName
        - accountName
        - accountNumberMasked
        - status
        - isDefault
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum:
            - BANK_ACCOUNT
            - MOBILE_MONEY
        institutionCode:
          type: string
        institutionName:
          type: string
        accountName:
          type: string
        accountNumberMasked:
          type: string
          description: '`••••6789`.'
        status:
          type: string
          enum:
            - UNVERIFIED
            - PENDING
            - VERIFIED
            - FAILED
          description: '`PENDING` waits for platform review; `FAILED` was rejected (see `decisionNote`).'
        isDefault:
          type: boolean
        payoutsAllowedAfter:
          description: Payouts to a new account wait for a 72-hour cooling-off after it was added.
          $ref: '#/components/schemas/Instant'
        reviewedAt:
          $ref: '#/components/schemas/Instant'
        decisionNote:
          type:
            - string
            - 'null'
    PaymentsSetup:
      type: object
      required:
        - provider
        - collectionMode
        - ready
        - enforced
        - blockers
        - organizationStatus
      properties:
        provider:
          type: string
          enum:
            - ARIFPAY
            - CHAPA
        collectionMode:
          type: string
          enum:
            - PLATFORM_COLLECTS
            - PROVIDER_SPLIT
        ready:
          type: boolean
          description: The business is verified and has a verified payout account (and, in Chapa mode, a subaccount).
        enforced:
          type: boolean
          description: When false (local development only) deposits are asked for even if the business is not ready.
        blockers:
          type: array
          items:
            type: string
            enum:
              - ORGANIZATION_NOT_VERIFIED
              - NO_PAYOUT_ACCOUNT
              - PAYOUT_ACCOUNT_IN_REVIEW
              - PAYOUT_ACCOUNT_REJECTED
              - SUBACCOUNT_MISSING
        organizationStatus:
          type: string
          enum:
            - UNVERIFIED
            - PENDING
            - VERIFIED
            - REJECTED
        legalEntityId:
          $ref: '#/components/schemas/Uuid'
        legalEntityName:
          type: string
          description: The account holder's name must match it.
        active:
          $ref: '#/components/schemas/PayoutAccount'
        pending:
          $ref: '#/components/schemas/PayoutAccount'
        rejected:
          $ref: '#/components/schemas/PayoutAccount'
    PayoutAccountInput:
      type: object
      required:
        - institutionCode
        - accountName
        - accountNumber
      properties:
        legalEntityId:
          $ref: '#/components/schemas/Uuid'
        institutionCode:
          type: string
          maxLength: 40
        accountName:
          type: string
          maxLength: 200
        accountNumber:
          type: string
          maxLength: 40
          description: Digits for a bank account (6 to 20); the wallet's mobile number for a wallet.
    PaymentLink:
      type: object
      required:
        - state
        - purpose
        - subject
        - amountMinor
        - currency
        - expiresAt
        - business
        - items
      properties:
        state:
          type: string
