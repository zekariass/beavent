openapi: 3.1.0
info:
  title: Beavent API
  version: 0.1.0
  summary: One API for booking services and selling events (docs/03 §2.4).
  description: |
    Conventions
    - JSON fields are camelCase. Money is `{ "amountMinor": 150000, "currency": "ETB" }` (integer minor units).
    - Instants are RFC 3339 UTC; local rules carry an IANA time zone. The Ethiopian calendar is display-only.
    - Partner (organization) endpoints live under `/v1/orgs/{orgId}`; the server checks membership and
      permission on every call and the database enforces row-level isolation.
    - Errors are `application/problem+json` with a stable `code` (see `Problem`).
    - POSTs that create orders, payments, refunds, payouts or tickets require `Idempotency-Key`.
    - Updates to versioned resources require `If-Match` with the `ETag` from the last read.
    - Lists use cursor pagination (`cursor`, `limit`).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: 'Same origin (local development: http://localhost:8080)'
security:
  - bearerAuth: []
tags:
  - name: Notifications
    description: What the signed-in person chose about reminders and quiet hours
  - name: Auth
    description: Sign-in, tokens and sessions
  - name: Me
    description: The signed-in person
  - name: Organizations
    description: Partner workspaces (businesses, freelancers, organizers)
  - name: Team access
    description: Members, roles, invitations
  - name: Verification
    description: Business verification (KYB)
  - name: Catalogue
    description: Services, variants, prices, add-ons, bundles, resources and galleries
  - name: Team
    description: Team profiles, pricing levels, working hours, shifts, time off and the rota
  - name: Booking policies
    description: Notice, horizon, slots, deposits, cancellation and no-show rules
  - name: Availability
    description: Which times can be booked, and with whom (public)
  - name: Calendar
    description: The business's calendar and front-desk status changes
  - name: Booking
    description: Holding a time, booking it, and the person's own appointments
  - name: Clients
    description: The business's clients — details, notes and alerts, tags, history, merging, importing, forms and patch tests
  - name: Marketplace
    description: What the public sees of a business (venue pages)
  - name: Discovery
    description: Search over places to book and things to do (public)
  - name: GiftCards
    description: Gift cards a business sells, delivers and honours as a payment method
  - name: Files
    description: Uploads (pre-signed), processing status, signed download URLs
  - name: Admin
    description: Admin console (platform staff only; admin-console token from a multi-factor sign-in)
  - name: Reference
    description: Markets, languages, categories, administrative areas
  - name: Payments
    description: Payment provider notifications (ArifPay by default, or Chapa), banks, and how a business gets paid
paths:
  /v1/hooks/{provider}:
    post:
      tags:
        - Payments
      operationId: receiveProviderNotification
      summary: A payment provider's notification (ArifPay or Chapa)
      description: |
        Called by the payment provider, not by apps. The raw body is stored and deduplicated before anything acts on it
        (docs/04 §7). Chapa notifications must carry a valid `x-chapa-signature` (HMAC-SHA256 of the raw body) or
        `chapa-signature`; ArifPay notifications are not signed, so they only prompt a lookup of the session with
        Beavent's key. A replayed delivery is acknowledged and stored once.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - arifpay
              - chapa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Received (stored, or a replay of a delivery already stored).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookReceipt'
        '400':
          description: The body is not a JSON object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookReceipt'
        '401':
          description: The signature is missing or wrong (signed providers only).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookReceipt'
        '404':
          description: That provider is not configured on this deployment.
  /v1/ref/banks:
    get:
      tags:
        - Payments
      operationId: listBanks
      summary: Banks and wallets a business can be paid into
      security: []
      parameters:
        - name: countryCode
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 2
      responses:
        '200':
          description: Banks and wallets, in the order screens list them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankList'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/orgs/{orgId}/payments/setup:
    get:
      tags:
        - Payments
      operationId: getPaymentsSetup
      summary: Whether the business may take online payments, and its payout account
      description: Needs `payouts.view`.
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: The setup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentsSetup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orgs/{orgId}/payout-accounts:
    post:
      tags:
        - Payments
      operationId: addPayoutAccount
      summary: Add a payout account for review
      description: |
        Needs `payouts.manage` and a fresh code (`STEP_UP_REQUIRED` otherwise). The holder's name must match the business's
        registered name (`CONSTRAINT_VIOLATION`); one account waits for review at a time (`CONFLICT`). The people who manage
        payouts are told. Payouts to the account start 72 hours after it was added, once platform staff verified it.
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutAccountInput'
      responses:
        '201':
          description: Added, waiting for review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/orgs/{orgId}/payout-accounts/{accountId}:
    delete:
      tags:
        - Payments
      operationId: withdrawPayoutAccount
      summary: Withdraw the account that is waiting for review
      description: Needs `payouts.manage` and a fresh code.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: accountId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          description: Withdrawn.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/public/payment-links/{token}:
    get:
      tags:
        - Payments
      operationId: getPaymentLink
      summary: What a payment link is for, and whether it can still be paid
      description: |
        No sign-in: the token in the address is the credential, and it pays only the one payment it was made for.
        `404` for a token that is not a link.
      parameters:
        - $ref: '#/components/parameters/LinkTokenParam'
      responses:
        '200':
          description: The link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLink'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/public/payment-links/{token}/start:
    post:
      tags:
        - Payments
      operationId: startPaymentLink
      summary: Start (or resume) the payment a link is for
      description: |
        Answers the provider's page to send the payer to; they come back to the link's own page. `HOLD_EXPIRED` when the link is no longer open, `CONFLICT` when it was paid already, `PAYMENT_UNAVAILABLE` when the
        provider cannot be reached.
      parameters:
        - $ref: '#/components/parameters/LinkTokenParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentLinkStartInput'
      responses:
        '200':
          description: The provider's page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStart'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/public/payment-links/{token}/check:
    post:
      tags:
        - Payments
      operationId: checkPaymentLink
      summary: After the payer came back, ask the provider and say where the payment stands
      parameters:
        - $ref: '#/components/parameters/LinkTokenParam'
      responses:
        '200':
          description: The link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLink'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orgs/{orgId}/gift-cards/program:
    get:
      tags:
        - GiftCards
      operationId: getGiftCardProgram
      summary: The gift cards the business sells (none yet when `program` is null)
      description: Needs `catalog.manage`.
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: The programme.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCardSetup'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
        - GiftCards
      operationId: saveGiftCardProgram
      summary: Set up what gift cards the business sells
      description: Needs `catalog.manage`. Creates the programme the first time, then updates it.
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftCardProgramInput'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCardProgram'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/orgs/{orgId}/gift-cards:
    get:
      tags:
        - GiftCards
      operationId: listGiftCards
      summary: Paid gift cards, newest first
      description: Needs `catalog.manage`. The code is never shown after it was delivered (only its last four characters).
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of cards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCardPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/orgs/{orgId}/gift-cards/{cardId}/void:
    post:
      tags:
        - GiftCards
      operationId: voidGiftCard
      summary: Void a card (what is left on it is written off; audited)
      description: Needs `refunds.create`.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: cardId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 5
                  maxLength: 500
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/public/locations/{locationId}/gift-cards:
    get:
      tags:
        - GiftCards
      operationId: getGiftCardOffer
      summary: What gift cards can be bought at a place (nothing when the business does not sell them online)
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '200':
          description: The offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCardOffer'
        '400':
          $ref: '#/components/responses/BadRequest'
  /v1/me/gift-cards/purchases:
    post:
      tags:
        - GiftCards
      operationId: buyGiftCard
      summary: Start buying a gift card; pay through the returned link
      description: |
        The card is created waiting for payment and delivered to the recipient (at once, or on `deliverAt`) after the payment
        is confirmed; a recipient without a phone number or email means the buyer. `payUrl` is a payment link, valid 30
        minutes. `CONFLICT` when the business does not sell cards online.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftCardPurchaseInput'
      responses:
        '201':
          description: Waiting for payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCardPurchase'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/public/payment-links/{token}/tender:
    post:
      tags:
        - Payments
      operationId: tenderPaymentLink
      summary: Pay part or all of the payment with a gift card
      description: |
        No sign-in. What the card cannot cover is still paid through the provider. `NOT_FOUND` for a code that cannot be
        used (unknown, spent, expired, or another business's); `CONFLICT` when a payment is in progress or the link was paid.
      parameters:
        - $ref: '#/components/parameters/LinkTokenParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  maxLength: 40
      responses:
        '200':
          description: Where the payment stands now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLink'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/me/appointments/{appointmentId}/payment/tender:
    post:
      tags:
        - Booking
      operationId: tenderMyAppointmentPayment
      summary: Pay part or all of the deposit with a gift card or the balance with the business
      description: |
        `GIFT_CARD` needs the card's `code`; `BALANCE` spends the signed-in person's credit with the business. What cannot be
        covered is still paid through the provider; the booking is confirmed when all of it is paid. `CONFLICT` when a payment
        is in progress or the booking is not waiting for payment; `NOT_FOUND` for a card that cannot be used.
      parameters:
        - $ref: '#/components/parameters/AppointmentIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kind
              properties:
                kind:
                  type: string
                  enum:
                    - GIFT_CARD
                    - BALANCE
                code:
                  type: string
                  maxLength: 40
      responses:
        '200':
          description: The booking, with where its payment stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/orgs/{orgId}/earnings:
    get:
      tags:
        - Payments
      operationId: getEarnings
      summary: What the business is owed, what is on its way, and its latest payouts
      description: Needs `payouts.view`. Amounts are what Beavent holds for the business (ArifPay mode).
      parameters:
        - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: The overview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Earnings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/orgs/{orgId}/statement:
    get:
      tags:
        - Payments
      operationId: getStatement
      summary: Sales, fees, refunds and payouts, newest first
      description: |
        Needs `payouts.view`. Each line is the net effect of one ledger transaction on what Beavent owes the business
        (positive: more). Movements between the business's own balances (a release for payout) are left out.
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the statement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statement'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/auth/otp/request:
    post:
      tags:
        - Auth
      operationId: requestOtp
      summary: Send a one-time code to a phone number
      description: Rate limited per phone and IP. SIGN_IN creates the account on first successful verification.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: Code sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/otp/verify:
    post:
      tags:
        - Auth
      operationId: verifyOtp
      summary: Verify a one-time code and sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerify'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/oauth/{provider}:
    post:
      tags:
        - Auth
      operationId: signInWithProvider
      summary: Sign in with Google or Apple
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum:
              - google
              - apple
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthLogin'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: This provider is not enabled.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshTokens
      summary: Exchange a refresh token for new tokens (rotation)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair; the old refresh token is no longer valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: signOut
      summary: Sign out (revoke the session, or all sessions)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/auth/step-up:
    post:
      tags:
        - Auth
      operationId: stepUp
      summary: Re-confirm identity before a sensitive action
      description: Returns an access token with assurance STEP_UP valid for 5 minutes (payout account changes, large refunds, exports).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      responses:
        '200':
          description: Step-up tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /.well-known/jwks.json:
    get:
      tags:
        - Auth
      operationId: getJwks
      summary: Public keys for verifying access tokens
      security: []
      responses:
        '200':
          description: JSON Web Key Set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/me:
    get:
      tags:
        - Me
      operationId: getMe
      summary: The signed-in person, with their organization memberships
      responses:
        '200':
          description: Profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
        - Me
      operationId: updateMe
      summary: Update profile and preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/me/sessions:
    get:
      tags:
        - Me
      operationId: listSessions
      summary: Active sessions across devices
      responses:
        '200':
          description: Sessions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me/sessions/{sessionId}:
    delete:
      tags:
        - Me
      operationId: revokeSession
      summary: Sign out one session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/devices:
    post:
      tags:
        - Me
      operationId: registerDevice
      summary: Register or update this device's push token
      requestBody:
        required: true
        content:
