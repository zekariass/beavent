components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token from /v1/auth/* (ES256, 10 minutes).
  schemas:
    PhoneE164:
      type: string
      pattern: ^\+[1-9][0-9]{6,14}$
      examples:
        - '+251911234567'
    OtpPurpose:
      type: string
      enum:
        - SIGN_IN
        - VERIFY_PHONE
        - STEP_UP
        - CLAIM_GUEST_ORDERS
        - CHANGE_PAYOUT_ACCOUNT
      description: SIGN_IN creates the account on first use (phone-first sign-up).
    OtpChannel:
      type: string
      enum:
        - SMS
        - TELEGRAM
        - WHATSAPP
        - VOICE
        - EMAIL
    ClientApp:
      type: string
      enum:
        - MOBILE_APP
        - WEB_MARKETPLACE
        - PARTNER_PORTAL
        - ADMIN_CONSOLE
    LanguageCode:
      type: string
      description: BCP 47 language code (am, om, ti, so, en, sw, ...).
      examples:
        - am
    OtpRequest:
      type: object
      description: Send a one-time code to a phone (SMS, Telegram, WhatsApp, voice) or to an email address (channel EMAIL).
      required:
        - purpose
        - clientApp
      oneOf:
        - required:
            - phone
        - required:
            - email
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'
        email:
          type: string
          format: email
          maxLength: 200
        purpose:
          $ref: '#/components/schemas/OtpPurpose'
        channel:
          allOf:
            - $ref: '#/components/schemas/OtpChannel'
          description: Defaults to SMS for phones and EMAIL for email addresses.
        clientApp:
          $ref: '#/components/schemas/ClientApp'
        language:
          $ref: '#/components/schemas/LanguageCode'
    Uuid:
      type: string
      format: uuid
    Instant:
      type: string
      format: date-time
      description: RFC 3339, UTC.
    OtpChallenge:
      type: object
      required:
        - challengeId
        - expiresAt
        - resendAfter
        - channel
      properties:
        challengeId:
          $ref: '#/components/schemas/Uuid'
        expiresAt:
          $ref: '#/components/schemas/Instant'
        resendAfter:
          $ref: '#/components/schemas/Instant'
        channel:
          $ref: '#/components/schemas/OtpChannel'
        codeLength:
          type: integer
          examples:
            - 6
    Problem:
      type: object
      description: RFC 9457 problem details with Beavent's stable `code`.
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
          examples:
            - urn:beavent:problem:slot-taken
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
          description: The request path that produced this problem.
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - FORBIDDEN
            - STEP_UP_REQUIRED
            - NOT_FOUND
            - CONFLICT
            - SLOT_TAKEN
            - SOLD_OUT
            - IMMUTABLE
            - CONCURRENT_UPDATE
            - IDEMPOTENCY_IN_PROGRESS
            - PRECONDITION_FAILED
            - IDEMPOTENCY_KEY_REUSED
            - REFERENCE_NOT_FOUND
            - CONSTRAINT_VIOLATION
            - PRECONDITION_REQUIRED
            - RATE_LIMITED
            - INTERNAL
        requestId:
          type: string
        errors:
          type: array
          description: Field-level validation errors.
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
    DeviceInfo:
      type: object
      required:
        - installationId
        - platform
      properties:
        installationId:
          type: string
          maxLength: 200
        platform:
          type: string
          enum:
            - IOS
            - ANDROID
            - WEB
        appVersion:
          type: string
          maxLength: 40
    OtpVerify:
      type: object
      required:
        - challengeId
        - code
      properties:
        challengeId:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
          pattern: ^[0-9]{4,8}$
        device:
          $ref: '#/components/schemas/DeviceInfo'
    CountryCode:
      type: string
      pattern: ^[A-Z]{2}$
      examples:
        - ET
    Membership:
      type: object
      required:
        - orgId
        - orgName
        - orgSlug
