          type: string
          enum:
            - PUBLIC
            - PRIVATE
            - SENSITIVE
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - PENDING_UPLOAD
            - PROCESSING
            - READY
            - REJECTED
          description: Public files get a `url` only when READY (scanned, metadata stripped).
        fileName:
          type: string
        url:
          type: string
          format: uri
          description: Public URL (CDN) of a READY public file.
        variants:
          type: object
          description: Smaller versions of a public image by name (w320, w960).
          additionalProperties:
            type: string
            format: uri
        width:
          type: integer
        height:
          type: integer
        createdAt:
          $ref: '#/components/schemas/Instant'
    FileUpload:
      type: object
      required:
        - file
        - upload
      properties:
        file:
          $ref: '#/components/schemas/File'
        upload:
          type: object
          required:
            - url
            - method
            - headers
            - expiresAt
          description: Send the file bytes with this method, URL and headers (directly to storage), then call `complete`.
          properties:
            url:
              type: string
              format: uri
            method:
              type: string
              enum:
                - PUT
            headers:
              type: object
              additionalProperties:
                type: string
            expiresAt:
              $ref: '#/components/schemas/Instant'
    AccessUrl:
      type: object
      required:
        - url
