    CategoryList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    AdminArea:
      type: object
      required:
        - id
        - countryCode
        - level
        - levelName
        - name
        - path
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        parentId:
          $ref: '#/components/schemas/Uuid'
        level:
