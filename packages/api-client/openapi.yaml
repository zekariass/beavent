          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutReveal'
      responses:
        '200':
          description: The number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountNumber'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/payout-accounts/{accountId}/decision:
    post:
      tags:
        - Admin
      operationId: decidePayoutAccount
      summary: Verify or reject a payout account (reason required, step-up, audited)
      description: |
        Needs `admin.payouts.approve` and a fresh code; staff cannot decide accounts of organizations they belong to.
        `REQUEST_INFO` is not used for accounts. Approving makes it the business's default account; the earlier one is retired.
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAccountSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/marketplace-listings:
    get:
      tags:
        - Admin
      operationId: listMarketplaceListings
      summary: Businesses by their place on the marketplace, oldest first (default `PENDING_REVIEW`)
      description: Needs `admin.marketplace.review`, in the business's market.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - HIDDEN
              - PENDING_REVIEW
              - LISTED
              - DELISTED
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceListingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/reviews:
    get:
      tags:
        - Admin
      operationId: listReviewsForModeration
      summary: Reviews that businesses reported (default) or that staff took down, oldest first
      description: Needs `admin.moderation`, in the business's market.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - REPORTED
              - HIDDEN
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffReviewPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/reviews/{reviewId}/decision:
    post:
      tags:
        - Admin
      operationId: decideReview
      summary: Hide a review, put it back, or dismiss the reports on it (reason required, audited)
      description: |
        Needs `admin.moderation`; staff cannot decide about a business they belong to. `HIDE` takes a published review
        down (it stops counting in the place's rating) and closes its reports as actioned; `RESTORE` puts a hidden review
        back; `DISMISS` closes the open reports and leaves the review. Each decision is recorded with its reason.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecision'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffReview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/orgs/{orgId}/marketplace-decision:
    post:
      tags:
        - Admin
      operationId: decideMarketplace
      summary: List a business on the marketplace, send its request back, or take it off (reason required, audited)
      description: |
        Needs `admin.marketplace.review`; staff cannot decide about a business they belong to. `LIST` needs an active
        location and a service people can book online (`CONSTRAINT_VIOLATION`) and a business that is not suspended,
        restricted or closed; `REJECT` answers a waiting request; `DELIST` takes a listed business off. The reason is shown
        to the business after `REJECT` and `DELIST`. The business is in or out of search right away.
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarketplaceDecision'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceListing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/admin/payouts:
    get:
      tags:
        - Admin
      operationId: listPayoutsForFinance
      summary: Seller payouts by queue, oldest first (default `APPROVAL`)
      description: Needs `admin.payments.view`.
      parameters:
        - name: queue
          in: query
          required: false
          schema:
            type: string
            enum:
              - APPROVAL
              - READY
              - PROCESSING
              - PAID
              - FAILED
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutSummaryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/payouts/export:
    post:
      tags:
        - Admin
      operationId: exportPayoutBatch
      summary: The bank batch (CSV with full account numbers) of the payouts ready to pay (step-up, audited)
      description: |
        Needs `admin.payouts.approve` and a fresh code. The exported payouts become `PROCESSING`. Payouts of organizations
        the staff member belongs to are left out.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutExport'
      responses:
        '200':
          description: The CSV.
          content:
            text/csv:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/payouts/{payoutId}/decision:
    post:
      tags:
        - Admin
      operationId: decidePayout
      summary: Approve or reject a payout that waits for approval (reason required, step-up, audited)
      description: |
        Needs `admin.payouts.approve` and a fresh code; staff cannot handle payouts of organizations they belong to.
        Rejecting gives the money back to the business's available balance.
      parameters:
        - name: payoutId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Decision'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/payouts/{payoutId}/settlement:
    post:
      tags:
        - Admin
      operationId: settlePayout
      summary: Record what happened to a payout in the bank (step-up, audited)
      description: |
        Needs `admin.payouts.approve` and a fresh code. `PAID` needs the bank's reference; `FAILED` and `RETURNED` need a
        reason and give the money back to the business. A payout is paid from `SCHEDULED`, `APPROVED` or `PROCESSING`.
      parameters:
        - name: payoutId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutSettlement'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/refunds:
    get:
      tags:
        - Admin
      operationId: listRefundsForFinance
      summary: Refunds by queue, oldest first (default `PAY`)
      description: |
        Needs `admin.payments.view`. `APPROVAL`: duplicate payments waiting for a decision; `PAY`: approved refunds finance
        pays by hand, and ones the provider could not pay; `PROCESSING`: being paid through the provider; `PAID`.
      parameters:
        - name: queue
          in: query
          required: false
          schema:
            type: string
            enum:
              - APPROVAL
              - PAY
              - PROCESSING
              - PAID
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
