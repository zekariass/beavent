          maxLength: 120
        note:
          type: string
          maxLength: 500
    AuditEntryPage:
      type: object
      required:
        - items
        - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        page:
          $ref: '#/components/schemas/PageInfo'
    Flag:
      type: object
      required:
        - code
        - description
        - defaultEnabled
        - overrides
        - updatedAt
      properties:
        code:
          type: string
        description:
          type: string
        defaultEnabled:
          type: boolean
        overrides:
          type: array
          items:
            type: object
            required:
              - enabled
            properties:
              marketCode:
                type: string
              orgId:
                $ref: '#/components/schemas/Uuid'
              userId:
                $ref: '#/components/schemas/Uuid'
              enabled:
                type: boolean
        updatedAt:
          $ref: '#/components/schemas/Instant'
    FlagList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Flag'
    FlagUpdate:
      type: object
      required:
        - defaultEnabled
        - reason
      properties:
        defaultEnabled:
          type: boolean
        reason:
          type: string
          minLength: 5
          maxLength: 500
    Market:
      type: object
      required:
        - code
        - countryCode
        - name
        - status
        - defaultCurrency
        - defaultLanguage
        - defaultTimezone
        - languages
        - currencies
      properties:
        code:
          type: string
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        name:
          type: string
        status:
          type: string
          enum:
            - PLANNED
            - PILOT
            - LIVE
            - PAUSED
            - RETIRED
        defaultCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        defaultLanguage:
          $ref: '#/components/schemas/LanguageCode'
        defaultTimezone:
          type: string
        displayCalendar:
          type: string
          enum:
            - GREGORIAN
            - ETHIOPIAN
        localTimeConvention:
          type: string
          enum:
            - STANDARD
            - ETHIOPIAN
        pricesIncludeTax:
          type: boolean
        languages:
          type: array
          items:
            type: object
            required:
              - code
              - isDefault
              - status
            properties:
              code:
                $ref: '#/components/schemas/LanguageCode'
              isDefault:
                type: boolean
              status:
                type: string
                enum:
                  - ENABLED
                  - BETA
        currencies:
          type: array
          items:
            type: object
            required:
              - code
              - minorUnits
              - canPrice
              - canPresent
            properties:
              code:
                $ref: '#/components/schemas/CurrencyCode'
              minorUnits:
                type: integer
              canPrice:
                type: boolean
              canPresent:
                type: boolean
        features:
          type: object
          additionalProperties:
            type: string
            enum:
              - DISABLED
              - BETA
              - ENABLED
    MarketList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Market'
    Language:
      type: object
      required:
        - code
        - englishName
        - nativeName
        - script
        - direction
      properties:
        code:
          $ref: '#/components/schemas/LanguageCode'
        englishName:
          type: string
        nativeName:
          type: string
        script:
          type: string
        direction:
          type: string
          enum:
            - LTR
            - RTL
    LanguageList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Language'
    Category:
      type: object
      required:
        - id
        - kind
        - vertical
        - code
        - name
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        parentId:
          $ref: '#/components/schemas/Uuid'
        kind:
          type: string
          enum:
            - BUSINESS
            - SERVICE
            - EVENT
            - PRODUCT
        vertical:
          type: string
        code:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedText'
        icon:
          type: string
    CategoryList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    AdminArea:
      type: object
      required:
        - id
        - countryCode
        - level
        - levelName
        - name
        - path
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        parentId:
          $ref: '#/components/schemas/Uuid'
        level:
          type: integer
        levelName:
          type: string
          examples:
            - SUB_CITY
        code:
          type: string
        name:
          type: string
        nameI18n:
          $ref: '#/components/schemas/LocalizedText'
        path:
          type: string
          examples:
            - ET.AA.BOLE
    AdminAreaList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminArea'
    PublicHoliday:
      type: object
      required:
        - date
        - name
        - isEstimated
      properties:
        date:
          type: string
          format: date
        name:
          $ref: '#/components/schemas/LocalizedText'
        adminAreaId:
          $ref: '#/components/schemas/Uuid'
          description: Absent = nationwide.
        isEstimated:
          type: boolean
          description: Moon-sighting holidays are confirmed close to the date.
    PublicHolidayList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicHoliday'
    Permission:
      type: object
      required:
        - code
        - module
        - description
        - isSensitive
      properties:
        code:
          type: string
          examples:
            - appointments.manage
        module:
          type: string
        description:
          type: string
        isSensitive:
          type: boolean
          description: Requires MFA / step-up.
    PermissionList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Not allowed for this person, organization or permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found (also returned when the resource belongs to another organization).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflicts with existing data.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Breaks a business rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: A service the request depends on (online payment) is unavailable; try again shortly.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NoContent:
      description: Done.
    TooManyRequests:
      description: Rate limited; retry after the `Retry-After` header.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: The resource changed since it was read (If-Match did not match).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    LinkTokenParam:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 20
        maxLength: 100
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        maxLength: 1024
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    AppointmentIdParam:
      name: appointmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the version being updated.
      schema:
        type: string
    Q:
      name: q
      in: query
      required: false
      description: What the person typed, in any script (Latin or Ge'ez). "bole" and "ቦሌ" find the same places; partial words and small misspellings match.
      schema:
        type: string
        maxLength: 100
    Kind:
      name: kind
      in: query
      required: false
      description: Only places (`LOCATION`) or only events (`EVENT`). Omitted = both together.
      schema:
        type: string
        enum:
          - LOCATION
          - EVENT
    Market:
      name: market
      in: query
      required: false
      description: Market code, e.g. `ET`.
      schema:
        type: string
    Category:
      name: category
      in: query
      required: false
      description: Category code (e.g. `BRAIDS`, `MUSIC`) or id. Matches the business's own category and its services', and the categories below it.
      schema:
        type: string
    Area:
      name: area
      in: query
      required: false
      description: Administrative area code (e.g. `BOLE`, `AA`) or id; includes the areas inside it.
      schema:
        type: string
    Lat:
      name: lat
      in: query
      required: false
      description: With `lng`, only listings within `radius` metres.
      schema:
        type: number
        minimum: -90
        maximum: 90
    Lng:
      name: lng
      in: query
      required: false
      schema:
        type: number
        minimum: -180
        maximum: 180
    Radius:
      name: radius
      in: query
      required: false
      description: Metres around `lat`/`lng`. Default 5000.
      schema:
        type: integer
        minimum: 100
        maximum: 50000
    West:
      name: west
      in: query
      required: false
      description: A map window (all four needed, west < east, south < north).
      schema:
        type: number
    South:
      name: south
      in: query
      required: false
      schema:
        type: number
    East:
      name: east
      in: query
      required: false
      schema:
        type: number
    North:
      name: north
      in: query
      required: false
      schema:
        type: number
    Sort:
      name: sort
      in: query
      required: false
      description: |
        `RECOMMENDED` (default; relevance when words were typed), `NEAREST` (needs `lat`/`lng`), `TOP_RATED`,
        `LOWEST_PRICE`, `SOONEST` (next bookable time or event start), `NEWEST`.
      schema:
        type: string
        enum:
          - RECOMMENDED
          - NEAREST
          - TOP_RATED
          - LOWEST_PRICE
          - SOONEST
          - NEWEST
    MaxPrice:
      name: maxPrice
      in: query
      required: false
      description: The "from" price is at most this many minor units of its currency.
      schema:
        type: integer
        format: int64
        minimum: 0
    MinRating:
      name: minRating
      in: query
      required: false
      schema:
        type: number
        minimum: 0
        maximum: 5
    OpenNow:
      name: openNow
      in: query
      required: false
      description: Places open at this moment (opening hours only; announced closures are not applied).
      schema:
        type: boolean
        default: false
    AtHome:
      name: atHome
      in: query
      required: false
      description: Places whose professionals come to the customer.
      schema:
        type: boolean
        default: false
    Audience:
      name: audience
      in: query
      required: false
      description: Places with services for this group (or for everyone).
      schema:
        type: string
        enum:
          - WOMEN
          - MEN
          - CHILDREN
    Language:
      name: language
      in: query
      required: false
      description: A language a professional speaks, e.g. `am`.
      schema:
        type: string
    Date:
      name: date
      in: query
      required: false
      description: First local date with a bookable time (places) or an occurrence (events), e.g. `2026-12-05`.
      schema:
        type: string
        format: date
    DateTo:
      name: dateTo
      in: query
      required: false
      description: Last local date (inclusive); defaults to `date`. At most 60 days after it.
      schema:
        type: string
        format: date
    Part:
      name: part
      in: query
      required: false
      description: Part of the local day (before 12:00, 12:00–17:00, from 17:00) within `date`…`dateTo`.
      schema:
        type: string
        enum:
          - MORNING
          - AFTERNOON
          - EVENING
    Free:
      name: free
      in: query
      required: false
      description: Events that cost nothing.
      schema:
        type: boolean
        default: false
    Online:
      name: online
      in: query
      required: false
      description: Events held online.
      schema:
        type: boolean
        default: false
    Business:
      name: business
      in: query
      required: false
      description: A business's public slug, to get only its places (a brand page lists its locations this way).
      schema:
        type: string
    Location:
      name: location
      in: query
      required: false
      description: Only these places, as a comma-separated list of location ids (at most 20), for the places a person booked before.
      schema:
        type: string
