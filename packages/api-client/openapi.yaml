          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/appointments/{appointmentId}/forms/{formId}:
    parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: formId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
    get:
      tags:
        - Booking
      operationId: getMyAppointmentForm
      summary: The questions of one form for one of the person's visits
      responses:
        '200':
          description: The questions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyFormQuestions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Booking
      operationId: answerMyAppointmentForm
      summary: Send the answers (again, until the visit starts; the newest answers count)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyFormAnswers'
      responses:
        '201':
          description: Sent.
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - submittedAt
                properties:
                  id:
                    $ref: '#/components/schemas/Uuid'
                  submittedAt:
                    $ref: '#/components/schemas/Instant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/public/locations/{locationId}/availability:
    post:
      tags:
        - Availability
      operationId: searchAvailability
      summary: Which start times can be booked at a location, and with whom
      description: |
        Public (no sign-in). Plans one person's ordered services back to back and lists the start times that work, in
        start order, with the person assigned to each service ("anyone" picks the first available). The answer is
        advisory: booking can still return `SLOT_TAKEN` if someone else is faster. Times are instants; the grid and the
        days are in the location's time zone.
      security: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityQuery'
      responses:
        '200':
          description: Bookable times.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/public/locations/{locationId}/holds:
    post:
      tags:
        - Booking
      operationId: holdTime
      summary: Hold a time for a few minutes while the person signs in and confirms
      description: |
        Public. Re-checks the time with the availability engine and reserves it for 10 minutes. Keep `holderKey`: it
        proves the hold is yours when you confirm or release it. `SLOT_TAKEN` means the time was taken meanwhile: ask
        availability again.
      security: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldInput'
      responses:
        '201':
          description: Held.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/public/locations/{locationId}/holds/{holdId}:
    delete:
      tags:
        - Booking
      operationId: releaseHold
      summary: Let go of a hold early (unknown, expired or converted holds are ignored)
      security: []
      parameters:
        - name: locationId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: holdId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Uuid'
        - name: X-Hold-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/appointments:
    get:
      tags:
        - Booking
      operationId: listMyAppointments
      summary: The signed-in person's appointments, newest first
      responses:
        '200':
          description: Appointments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAppointmentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Booking
      operationId: bookAppointment
      summary: Turn a hold into an appointment (pay at the venue)
      description: |
        The signed-in person becomes the business's customer. `CONFIRMED`, or `REQUESTED` when the business confirms
        each booking itself. Repeating the call for the same hold returns the same appointment (`200`).
        `HOLD_EXPIRED` means the hold ran out: hold a time again. `403` when the business has blocked the person from
        booking online (they book by phone). `PATCH_TEST_REQUIRED` (422) when a service needs a patch test and the
        person has no passed test valid on the day.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '200':
          description: Already booked with this hold.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '201':
          description: Booked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/me/appointments/{appointmentId}:
    get:
      tags:
        - Booking
      operationId: getMyAppointment
      summary: One of the signed-in person's appointments, with what cancelling now would mean
      parameters:
        - $ref: '#/components/parameters/AppointmentIdParam'
      responses:
        '200':
          description: The appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/appointments/{appointmentId}/cancel:
    post:
      tags:
        - Booking
      operationId: cancelMyAppointment
      summary: Cancel (free before the free-cancellation time, otherwise the late fee is recorded)
      parameters:
        - $ref: '#/components/parameters/AppointmentIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                refundTo:
                  type: string
                  enum:
                    - ORIGINAL
                    - BALANCE
                  description: |
                    Where a refund of the deposit goes: back the way it was paid (`ORIGINAL`, the default), or kept as credit
                    with the business at once (`BALANCE`).
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/me/appointments/{appointmentId}/payment:
    post:
      tags:
        - Booking
      operationId: startMyAppointmentPayment
      summary: Start (or resume) paying the deposit of an unpaid booking
      description: |
        Returns the payment provider's page to send the person to (ArifPay by default). They come back to
        `…/account/bookings/{id}/payment`, which asks `POST …/payment/check`; a redirect is never proof of payment. An attempt
        already open is returned as it is; after a declined one a new attempt starts. `HOLD_EXPIRED` means the time ran
        out; `PAYMENT_UNAVAILABLE`, the provider cannot be reached right now.
      parameters:
        - $ref: '#/components/parameters/AppointmentIdParam'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
                  maxLength: 5
                  description: The language of the pages the provider sends the person back to.
      responses:
        '200':
          description: Where to pay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/me/appointments/{appointmentId}/payment/check:
    post:
      tags:
        - Booking
      operationId: checkMyAppointmentPayment
      summary: Ask the provider where the payment stands, then return the booking
      description: |
        For the page the person lands on after paying (and its "I've paid" button). The provider is asked with Beavent's
        key; the answer decides, never the browser's redirect. Poll every few seconds while `payment.state` is
        `AWAITING_PAYMENT`.
      parameters:
        - $ref: '#/components/parameters/AppointmentIdParam'
      responses:
        '200':
          description: The booking, with its payment state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/me/appointments/{appointmentId}/reschedule:
    post:
      tags:
        - Booking
      operationId: rescheduleMyAppointment
      summary: Move to another time with the same services (allowed until the free-cancellation time)
      description: |
        Ask availability for the same services first. The person the customer chose stays; "anyone" may become someone
        else. Prices stay as booked. `SLOT_TAKEN` leaves the appointment unchanged.
      parameters:
        - $ref: '#/components/parameters/AppointmentIdParam'
      requestBody:
