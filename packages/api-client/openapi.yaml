  /v1/orgs/{orgId}/appointments:
    post:
      tags:
        - Calendar
      operationId: bookAtTheDesk
      summary: Book a walk-in or phone customer (needs appointments.manage, or manage_own in your own column)
      description: |
        Front-desk rules: any five-minute start, no notice or horizon, services hidden from online booking allowed.
        Working time, opening hours and the calendar apply: a busy time is `SLOT_TAKEN` unless `bookAnyway`, which
        writes a deliberate overlap. `notifyCustomer` (default true) sends the confirmation; reminders follow anyway.
      parameters:
        - $ref: '#/components/parameters/OrgId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeskBookingInput'
