plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '8.11.0'
	// Generates jOOQ classes from a throwaway PostGIS container migrated with db/migration.
	id 'dev.monosoul.jooq-docker' version '9.0.11'
}

group = 'com.beavent'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		// Java 21 LTS today; moving to 25 LTS needs no code change.
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springModulithVersion', '2.1.2')
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
	}
}

dependencies {
	// Web & security
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'

	// Data: PostgreSQL + PostGIS, schema owned by db/migration (Flyway), typed SQL via jOOQ
	implementation 'org.springframework.boot:spring-boot-starter-jooq'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	// compile scope: SqlStateProblems reads PostgreSQL error details (SQLSTATE, table)
	implementation 'org.postgresql:postgresql'

	// Coordination & messaging
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'

	// Module boundaries (one module per database schema; see docs/03 §2.2)
	implementation 'org.springframework.modulith:spring-modulith-starter-core'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// jOOQ code generation (versions from the Spring Boot BOM, matching the runtime)
	jooqCodegen 'org.postgresql:postgresql'
	jooqCodegen 'org.jooq:jooq-codegen'
	jooqCodegen 'org.flywaydb:flyway-core'
	jooqCodegen 'org.flywaydb:flyway-database-postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-rabbitmq'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The database baseline lives at the repository root (db/migration) so that SQL review,
// validate.sh and the application all use the same files. Package it for Flyway here.
tasks.named('processResources') {
	from("${rootDir}/../db/migration") {
		into 'db/migration'
	}
	// Bundled API contract (npm run api:spec), served at /v1/openapi.yaml.
	from("${rootDir}/../packages/api-client/openapi.yaml") {
		into 'openapi'
		rename { 'beavent.yaml' }
	}
}

// --- jOOQ code generation -------------------------------------------------------------
def postgisImage = 'postgis/postgis:17-3.5'

jooq {
	withContainer {
		image {
			name = postgisImage
			envVars = [POSTGRES_USER: 'postgres', POSTGRES_PASSWORD: 'postgres', POSTGRES_DB: 'postgres']
		}
		db {
			username = 'postgres'
			password = 'postgres'
			name = 'postgres'
			port = 5432
		}
	}
}

// The official PostGIS image is amd64-only. Pre-pull it with an explicit platform so code generation also
// works on Apple Silicon (Testcontainers then uses the local image).
tasks.register('pullPostgisImage', Exec) {
	commandLine 'sh', '-c', "docker image inspect ${postgisImage} >/dev/null 2>&1 || docker pull --platform linux/amd64 ${postgisImage}"
}

tasks.named('generateJooqClasses') {
	dependsOn 'pullPostgisImage'
	// Outside com.beavent.backend so Spring Modulith does not treat generated code as an application module.
	basePackageName = 'com.beavent.db'
	schemas = ['platform', 'ref', 'iam', 'tenant', 'team', 'catalog', 'crm', 'events', 'commerce', 'scheduling',
			'retention', 'stock', 'payments', 'ledger', 'billing', 'fiscal', 'marketing', 'comms', 'discovery', 'trust']
	migrationLocations.set([new dev.monosoul.jooq.migration.MigrationLocation.Filesystem(files("${rootDir}/../db/migration"))])
	outputDirectory = layout.buildDirectory.dir('generated-jooq')
	flywayProperties.put('flyway.placeholderReplacement', 'false')
	// Same as the application: history table in public; the migrations create the schemas themselves.
	flywayProperties.put('flyway.schemas', 'public')
	flywayProperties.put('flyway.defaultSchema', 'public')
	flywayProperties.put('flyway.createSchemas', 'false')
	usingJavaConfig {
		database.withExcludes('flyway_schema_history')
		// Explicit joins only: generated implicit-join paths clash where a table references two tables of the
		// same name in different schemas (payments.payment_intents -> billing.invoices / commerce.invoices).
		generate.withJavaTimeTypes(true).withPojos(false).withDaos(false).withRecords(true).withFluentSetters(true)
				.withImplicitJoinPathsToOne(false).withImplicitJoinPathsToMany(false).withImplicitJoinPathsManyToMany(false)
	}
}

tasks.named('bootJar') {
	archiveFileName = 'beavent-api.jar'
}

tasks.named('jar') {
	enabled = false
}

tasks.named('test') {
	useJUnitPlatform()
}

// ./gradlew bootRun uses the local profile (docker compose services).
tasks.named('bootRun') {
	systemProperty 'spring.profiles.active', System.getenv('SPRING_PROFILES_ACTIVE') ?: 'local'
}

spotless {
	java {
		target 'src/**/*.java'
		palantirJavaFormat('2.103.0')
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
	}
}
