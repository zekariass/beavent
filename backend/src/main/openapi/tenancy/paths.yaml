      - $ref: ../common/parameters.yaml#/OrgId
      - name: memberId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/MemberUpdate
    responses:
