organizations:
  post:
    tags: [Organizations]
    operationId: createOrganization
    summary: Create an organization (the caller becomes its owner)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/OrganizationCreate
    responses:
      '201':
        description: Created.
        headers:
          ETag:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Organization
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '409':
        $ref: ../common/responses.yaml#/Conflict
organization:
  get:
    tags: [Organizations]
    operationId: getOrganization
    summary: Get an organization
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
    responses:
      '200':
        description: Organization.
        headers:
          ETag:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Organization
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
  patch:
    tags: [Organizations]
    operationId: updateOrganization
    summary: Update profile details
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - $ref: ../common/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/OrganizationUpdate
    responses:
      '200':
        description: Updated.
        headers:
          ETag:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Organization
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '412':
        $ref: ../common/responses.yaml#/PreconditionFailed
capabilities:
  put:
    tags: [Organizations]
