otpRequest:
  post:
    tags: [Auth]
    operationId: requestOtp
    summary: Send a one-time code to a phone number
    description: Rate limited per phone and IP. SIGN_IN creates the account on first successful verification.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/OtpRequest
    responses:
      '202':
        description: Code sent.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/OtpChallenge
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '429':
        $ref: ../common/responses.yaml#/TooManyRequests
otpVerify:
  post:
    tags: [Auth]
    operationId: verifyOtp
    summary: Verify a one-time code and sign in
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/OtpVerify
    responses:
      '200':
        description: Signed in, or a second factor is required.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AuthResult
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '429':
        $ref: ../common/responses.yaml#/TooManyRequests
passwordLogin:
  post:
    tags: [Auth]
    operationId: signInWithPassword
    summary: Sign in with phone or email and password
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/PasswordLogin
    responses:
      '200':
        description: Signed in, or a second factor is required.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AuthResult
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '429':
        $ref: ../common/responses.yaml#/TooManyRequests
oauthLogin:
  post:
    tags: [Auth]
    operationId: signInWithProvider
    summary: Sign in with Google or Apple
    security: []
    parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          enum: [google, apple]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/OAuthLogin
    responses:
      '200':
        description: Signed in, or a second factor is required.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AuthResult
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
mfaVerify:
  post:
    tags: [Auth]
    operationId: verifyMfa
    summary: Complete sign-in with the second factor
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/MfaVerify
    responses:
      '200':
        description: Signed in.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Tokens
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '429':
        $ref: ../common/responses.yaml#/TooManyRequests
refresh:
  post:
    tags: [Auth]
    operationId: refreshTokens
    summary: Exchange a refresh token for new tokens (rotation)
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/RefreshRequest
    responses:
      '200':
        description: New token pair; the old refresh token is no longer valid.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Tokens
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
logout:
  post:
    tags: [Auth]
    operationId: signOut
    summary: Sign out (revoke the session, or all sessions)
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/LogoutRequest
    responses:
      '204':
        $ref: ../common/responses.yaml#/NoContent
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
stepUp:
  post:
    tags: [Auth]
    operationId: stepUp
    summary: Re-confirm identity before a sensitive action
    description: Returns an access token with assurance STEP_UP valid for 5 minutes (payout account changes, large refunds, exports).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/StepUpRequest
    responses:
      '200':
        description: Step-up tokens.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Tokens
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
jwks:
  get:
    tags: [Auth]
    operationId: getJwks
    summary: Public keys for verifying access tokens
    security: []
    responses:
      '200':
        description: JSON Web Key Set.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Jwks
      '429':
        $ref: ../common/responses.yaml#/TooManyRequests
me:
  get:
    tags: [Me]
    operationId: getMe
    summary: The signed-in person, with their organization memberships
    responses:
      '200':
        description: Profile.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Me
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
  patch:
    tags: [Me]
    operationId: updateMe
    summary: Update profile and preferences
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/MeUpdate
    responses:
      '200':
        description: Updated profile.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Me
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '409':
        $ref: ../common/responses.yaml#/Conflict
mePassword:
  put:
    tags: [Me]
    operationId: changePassword
    summary: Set or change the password (revokes other sessions)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/PasswordChange
    responses:
      '204':
        $ref: ../common/responses.yaml#/NoContent
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
meTotp:
  post:
    tags: [Me]
    operationId: enrollTotp
    summary: Start enrolling an authenticator app
    responses:
      '201':
        description: Secret to add to the authenticator app.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/TotpEnrollment
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
meTotpConfirm:
  post:
    tags: [Me]
    operationId: confirmTotp
    summary: Confirm the authenticator app with a first code
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/TotpConfirm
    responses:
      '204':
        $ref: ../common/responses.yaml#/NoContent
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
meSessions:
  get:
    tags: [Me]
    operationId: listSessions
    summary: Active sessions across devices
    responses:
      '200':
        description: Sessions.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/SessionList
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
meSession:
  delete:
    tags: [Me]
    operationId: revokeSession
    summary: Sign out one session
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '204':
        $ref: ../common/responses.yaml#/NoContent
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '404':
        $ref: ../common/responses.yaml#/NotFound
meDevices:
  post:
    tags: [Me]
    operationId: registerDevice
    summary: Register or update this device's push token
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/DeviceRegistration
    responses:
      '204':
        $ref: ../common/responses.yaml#/NoContent
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
meConsents:
  post:
    tags: [Me]
    operationId: acceptLegalDocuments
    summary: Record acceptance of terms / privacy notice versions
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/ConsentAcceptance
    responses:
      '204':
        $ref: ../common/responses.yaml#/NoContent
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
