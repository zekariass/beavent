OtpPurpose:
  type: string
  enum: [SIGN_IN, VERIFY_PHONE, STEP_UP, CLAIM_GUEST_ORDERS, CHANGE_PAYOUT_ACCOUNT]
  description: SIGN_IN creates the account on first use (phone-first sign-up).
OtpChannel:
  type: string
  enum: [SMS, TELEGRAM, WHATSAPP, VOICE]
ClientApp:
  type: string
  enum: [MOBILE_APP, WEB_MARKETPLACE, PARTNER_PORTAL, ADMIN_CONSOLE]
DeviceInfo:
  type: object
  required: [installationId, platform]
  properties:
    installationId:
      type: string
      maxLength: 200
    platform:
      type: string
      enum: [IOS, ANDROID, WEB]
    appVersion:
      type: string
      maxLength: 40
OtpRequest:
  type: object
  required: [phone, purpose, clientApp]
  properties:
    phone:
      $ref: ../common/schemas.yaml#/PhoneE164
    purpose:
      $ref: '#/OtpPurpose'
    channel:
      allOf:
        - $ref: '#/OtpChannel'
      default: SMS
    clientApp:
      $ref: '#/ClientApp'
    language:
      $ref: ../common/schemas.yaml#/LanguageCode
OtpChallenge:
  type: object
  required: [challengeId, expiresAt, resendAfter, channel]
  properties:
    challengeId:
      $ref: ../common/schemas.yaml#/Uuid
    expiresAt:
      $ref: ../common/schemas.yaml#/Instant
    resendAfter:
      $ref: ../common/schemas.yaml#/Instant
    channel:
      $ref: '#/OtpChannel'
    codeLength:
      type: integer
      examples: [6]
OtpVerify:
  type: object
  required: [challengeId, code]
  properties:
    challengeId:
      $ref: ../common/schemas.yaml#/Uuid
    code:
      type: string
      pattern: ^[0-9]{4,8}$
    device:
      $ref: '#/DeviceInfo'
PasswordLogin:
  type: object
  required: [identifier, password, clientApp]
  properties:
    identifier:
      type: string
      description: Phone number (E.164) or email.
      maxLength: 320
    password:
      type: string
      format: password
      minLength: 1
      maxLength: 256
    clientApp:
      $ref: '#/ClientApp'
    device:
      $ref: '#/DeviceInfo'
OAuthLogin:
  type: object
  required: [idToken, nonce, clientApp]
  properties:
    idToken:
      type: string
      description: ID token from Google or Apple, verified server-side (issuer, audience, signature, nonce).
    nonce:
      type: string
    clientApp:
      $ref: '#/ClientApp'
    device:
      $ref: '#/DeviceInfo'
MfaVerify:
  type: object
  required: [mfaChallengeId, code]
  properties:
    mfaChallengeId:
      $ref: ../common/schemas.yaml#/Uuid
    code:
      type: string
      pattern: ^[0-9]{6}$
RefreshRequest:
  type: object
  required: [refreshToken]
  properties:
    refreshToken:
      type: string
      format: password
LogoutRequest:
  type: object
  properties:
    refreshToken:
      type: string
      format: password
      description: Revokes this session; omit to revoke the session of the access token.
    allSessions:
      type: boolean
      default: false
StepUpRequest:
  type: object
  required: [method, code]
  properties:
    method:
      type: string
      enum: [OTP, TOTP]
    challengeId:
      $ref: ../common/schemas.yaml#/Uuid
    code:
      type: string
      pattern: ^[0-9]{4,8}$
AuthResult:
  description: Either tokens, or a second factor is required first.
  oneOf:
    - $ref: '#/Tokens'
    - $ref: '#/MfaRequired'
  discriminator:
    propertyName: result
    mapping:
      TOKENS: '#/Tokens'
      MFA_REQUIRED: '#/MfaRequired'
Tokens:
  type: object
  required: [result, accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt, user, isNewUser]
  properties:
    result:
      type: string
      const: TOKENS
    accessToken:
      type: string
    accessTokenExpiresAt:
      $ref: ../common/schemas.yaml#/Instant
    refreshToken:
      type: string
      description: Opaque; rotated on every refresh. Reusing an old one revokes the whole session family.
    refreshTokenExpiresAt:
      $ref: ../common/schemas.yaml#/Instant
    isNewUser:
      type: boolean
    user:
      $ref: '#/Me'
MfaRequired:
  type: object
  required: [result, mfaChallengeId, methods]
  properties:
    result:
      type: string
      const: MFA_REQUIRED
    mfaChallengeId:
      $ref: ../common/schemas.yaml#/Uuid
    methods:
      type: array
      items:
        type: string
        enum: [TOTP, SMS]
Jwks:
  type: object
  required: [keys]
  properties:
    keys:
      type: array
      items:
        type: object
        additionalProperties: true
Membership:
  type: object
  required: [orgId, orgName, orgSlug, roleCode, roleName, isOwner, capabilities]
  properties:
    orgId:
      $ref: ../common/schemas.yaml#/Uuid
    orgName:
      type: string
    orgSlug:
      type: string
    roleCode:
      type: string
    roleName:
      type: string
    isOwner:
      type: boolean
    capabilities:
      type: array
      items:
        type: string
Me:
  type: object
  required: [id, status, phoneVerified, emailVerified, mfaEnabled, memberships, isPlatformStaff]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    phone:
      $ref: ../common/schemas.yaml#/PhoneE164
    phoneVerified:
      type: boolean
    email:
      type: string
      format: email
    emailVerified:
      type: boolean
    status:
      type: string
      enum: [PENDING, ACTIVE, LOCKED, SUSPENDED, CLOSED]
    firstName:
      type: string
    lastName:
      type: string
      description: In Ethiopia usually the father's name; never required.
    displayName:
      type: string
    avatarFileId:
      $ref: ../common/schemas.yaml#/Uuid
    countryCode:
      $ref: ../common/schemas.yaml#/CountryCode
    preferredLanguage:
      $ref: ../common/schemas.yaml#/LanguageCode
    displayCalendar:
      type: string
      enum: [GREGORIAN, ETHIOPIAN]
    timezone:
      type: string
    mfaEnabled:
      type: boolean
    hasPassword:
      type: boolean
    isPlatformStaff:
      type: boolean
    memberships:
      type: array
      items:
        $ref: '#/Membership'
MeUpdate:
  type: object
  minProperties: 1
  properties:
    firstName:
      type: [string, 'null']
      maxLength: 100
    lastName:
      type: [string, 'null']
      maxLength: 100
    displayName:
      type: [string, 'null']
      maxLength: 100
    email:
      type: [string, 'null']
      format: email
      description: Changing the email starts a verification.
    avatarFileId:
      type: [string, 'null']
      format: uuid
    preferredLanguage:
      $ref: ../common/schemas.yaml#/LanguageCode
    displayCalendar:
      type: string
      enum: [GREGORIAN, ETHIOPIAN]
    timezone:
      type: string
PasswordChange:
  type: object
  required: [newPassword]
  properties:
    currentPassword:
      type: string
      format: password
      description: Required when a password is already set (step-up token also accepted).
    newPassword:
      type: string
      format: password
      minLength: 10
      maxLength: 256
TotpEnrollment:
  type: object
  required: [factorId, otpauthUri, secret]
  properties:
    factorId:
      $ref: ../common/schemas.yaml#/Uuid
    otpauthUri:
      type: string
    secret:
      type: string
      description: Base32; shown once.
TotpConfirm:
  type: object
  required: [factorId, code]
  properties:
    factorId:
      $ref: ../common/schemas.yaml#/Uuid
    code:
      type: string
      pattern: ^[0-9]{6}$
Session:
  type: object
  required: [id, clientApp, createdAt, current]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    clientApp:
      $ref: '#/ClientApp'
    deviceLabel:
      type: string
    ipAddress:
      type: string
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
    lastUsedAt:
      $ref: ../common/schemas.yaml#/Instant
    current:
      type: boolean
SessionList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/Session'
DeviceRegistration:
  type: object
  required: [installationId, platform]
  properties:
    installationId:
      type: string
      maxLength: 200
    platform:
      type: string
      enum: [IOS, ANDROID, WEB]
    pushToken:
      type: string
      maxLength: 4096
    appVersion:
      type: string
    locale:
      type: string
ConsentAcceptance:
  type: object
  required: [documentVersionIds]
  properties:
    documentVersionIds:
      type: array
      minItems: 1
      items:
        $ref: ../common/schemas.yaml#/Uuid
