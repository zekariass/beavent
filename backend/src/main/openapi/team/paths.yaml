    tags: [Team]
    operationId: archiveStaff
    summary: Archive a team profile (history is kept)
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: staffId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
