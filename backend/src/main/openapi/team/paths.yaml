      - $ref: ../common/parameters.yaml#/OrgId
      - name: staffId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '200':
        description: OK.
        headers:
          ETag:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Staff
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
  put:
    tags: [Team]
    operationId: updateStaff
    summary: Replace a team profile
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: staffId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
      - $ref: ../common/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/StaffInput
    responses:
      '200':
        description: OK.
        headers:
          ETag:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Staff
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
      '412':
