      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
workingPattern:
  get:
    tags: [Team]
    operationId: getWorkingPattern
    summary: Regular working hours in effect on a date (default today)
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: staffId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
      - name: date
        in: query
        required: false
        schema:
          type: string
          format: date
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/WorkingPattern
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
  put:
    tags: [Team]
    operationId: setWorkingPattern
    summary: Set regular working hours from a date on (earlier days keep the old pattern)
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: staffId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/WorkingPatternInput
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/WorkingPattern
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
