  get:
    tags: [Team]
    operationId: getMyStaffProfile
    summary: Your own team profile in this organization (for "My schedule")
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
    responses:
      '200':
        description: Profile.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Staff
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '404':
