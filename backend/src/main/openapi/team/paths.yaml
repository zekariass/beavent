pricingLevels:
  get:
    tags: [Team]
    operationId: listPricingLevels
    summary: Pricing levels (Junior, Senior, Master …)
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/PricingLevelList
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
  post:
    tags: [Team]
    operationId: createPricingLevel
    summary: Add a pricing level
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/PricingLevelInput
    responses:
      '201':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/PricingLevel
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
pricingLevel:
  put:
    tags: [Team]
    operationId: updatePricingLevel
    summary: Rename or re-rank a pricing level
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: levelId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/PricingLevelInput
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/PricingLevel
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
  delete:
    tags: [Team]
    operationId: deletePricingLevel
    summary: Delete an unused pricing level
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: levelId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '204':
        $ref: ../common/responses.yaml#/NoContent
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
staffList:
  get:
    tags: [Team]
    operationId: listStaff
    summary: Team profiles
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: locationId
        in: query
        required: false
        schema:
          $ref: ../common/schemas.yaml#/Uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/StaffList
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
  post:
    tags: [Team]
    operationId: createStaff
    summary: Add a team profile (with or without a login)
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/StaffInput
    responses:
      '201':
        description: OK.
        headers:
          ETag:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Staff
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
staff:
