serviceGroups:
  get:
    tags: [Catalogue]
    operationId: listServiceGroups
    summary: Service groups (menu sections)
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/ServiceGroupList
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
  post:
    tags: [Catalogue]
    operationId: createServiceGroup
    summary: Add a menu section
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/ServiceGroupInput
    responses:
      '201':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/ServiceGroup
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
serviceGroup:
  put:
    tags: [Catalogue]
    operationId: updateServiceGroup
    summary: Rename or reorder a menu section
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: groupId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/ServiceGroupInput
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/ServiceGroup
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
  delete:
    tags: [Catalogue]
    operationId: deleteServiceGroup
    summary: Remove an empty menu section
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: groupId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '204':
        $ref: ../common/responses.yaml#/NoContent
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
services:
  get:
    tags: [Catalogue]
    operationId: listServices
    summary: The service menu
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: groupId
        in: query
        required: false
        schema:
          $ref: ../common/schemas.yaml#/Uuid
      - name: locationId
        in: query
        required: false
        schema:
          $ref: ../common/schemas.yaml#/Uuid
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [ACTIVE, HIDDEN, ARCHIVED]
      - $ref: ../common/parameters.yaml#/Cursor
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/ServiceList
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
  post:
    tags: [Catalogue]
    operationId: createService
    summary: Add a service with its variants
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/ServiceInput
    responses:
      '201':
        description: OK.
        headers:
          ETag:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Service
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
service:
  get:
    tags: [Catalogue]
    operationId: getService
    summary: A service
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: serviceId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '200':
        description: OK.
        headers:
          ETag:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Service
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
  put:
    tags: [Catalogue]
    operationId: updateService
    summary: Replace a service and its variants (variants left out are archived)
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: serviceId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
      - $ref: ../common/parameters.yaml#/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/ServiceInput
    responses:
      '200':
        description: OK.
        headers:
          ETag:
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Service
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
      '412':
        $ref: ../common/responses.yaml#/PreconditionFailed
  delete:
    tags: [Catalogue]
    operationId: archiveService
    summary: Archive a service (kept for history)
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: serviceId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '204':
        $ref: ../common/responses.yaml#/NoContent
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
