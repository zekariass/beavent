spring.application.name=beavent-api

# --- Local development defaults (docker compose up -d). Override with environment variables elsewhere.
# Migrations run as the schema owner; request handling will use the least-privilege roles
# (beavent_app / beavent_identity / beavent_system) wired in Stage 0, step 0.5.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/beavent}
spring.datasource.username=${DATABASE_USER:beavent}
spring.datasource.password=${DATABASE_PASSWORD:beavent}

spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.jooq.sql-dialect=postgres

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:beavent}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:beavent}

management.endpoints.web.exposure.include=health,info
