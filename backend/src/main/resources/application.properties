spring.application.name=beavent-api

# --- Database ----------------------------------------------------------------------------------------------------
# Schema owner: used by Flyway only. Request handling uses the least-privilege roles below (docs/05 §5).
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.jooq.sql-dialect=postgres

beavent.db.app.username=${DB_APP_USER}
beavent.db.app.password=${DB_APP_PASSWORD}
beavent.db.identity.username=${DB_IDENTITY_USER}
beavent.db.identity.password=${DB_IDENTITY_PASSWORD}
beavent.db.system.username=${DB_SYSTEM_USER}
beavent.db.system.password=${DB_SYSTEM_PASSWORD}

# --- Identity -----------------------------------------------------------------------------------------------------
# AUTH_SECRET_KEY: base64, >= 32 bytes. AUTH_JWT_SIGNING_JWK: private EC P-256 JWK with a kid (secret manager).
beavent.auth.secret-key=${AUTH_SECRET_KEY}
beavent.auth.jwt.signing-jwk=${AUTH_JWT_SIGNING_JWK:}
beavent.auth.oauth.google.client-ids=${GOOGLE_CLIENT_IDS:}
beavent.auth.oauth.apple.client-ids=${APPLE_CLIENT_IDS:}
# SMS/Telegram/WhatsApp provider for one-time codes (plan dependency D4).
beavent.sms.provider=${SMS_PROVIDER}

# --- Web -----------------------------------------------------------------------------------------------------------
# Trust X-Forwarded-* from the edge proxy (client IP for rate limits, scheme for links).
server.forward-headers-strategy=framework
spring.jackson.default-property-inclusion=non_null

# --- Messaging -----------------------------------------------------------------------------------------------------
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
# Broker confirms each outbox message before the row is marked published.
spring.rabbitmq.publisher-confirm-type=simple
beavent.outbox.relay.enabled=${OUTBOX_RELAY_ENABLED:true}
beavent.outbox.relay.interval-ms=500

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}

# --- Observability -------------------------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
# OTLP export is off until a collector exists (hosting decision); trace/span ids still appear in logs.
management.otlp.metrics.export.enabled=${OTLP_METRICS_ENABLED:false}
management.tracing.export.otlp.enabled=${OTLP_TRACING_ENABLED:false}
management.tracing.sampling.probability=${TRACING_SAMPLING:0.1}
logging.pattern.correlation=[%X{traceId:-},%X{spanId:-},%X{requestId:-}] 
