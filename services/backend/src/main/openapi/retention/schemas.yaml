GiftCardProgram:
  type: object
  required: [id, name, currency, presetsMinor, minMinor, maxMinor, sellOnline]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    name:
      type: string
    currency:
      type: string
    presetsMinor:
      type: array
      items:
        type: integer
        format: int64
    minMinor:
      type: integer
      format: int64
    maxMinor:
      type: integer
      format: int64
    validityMonths:
      type: [integer, 'null']
    sellOnline:
      type: boolean
GiftCardSetup:
  type: object
  properties:
    program:
      oneOf:
        - $ref: '#/GiftCardProgram'
        - type: 'null'
GiftCardProgramInput:
  type: object
  required: [name, minMinor, maxMinor, sellOnline]
  properties:
    name:
      type: string
      maxLength: 80
    presetsMinor:
      type: array
      maxItems: 8
      items:
        type: integer
        format: int64
        minimum: 1
      description: Amounts offered as buttons, each between the limits.
    minMinor:
      type: integer
      format: int64
      minimum: 1
    maxMinor:
      type: integer
      format: int64
      minimum: 1
    validityMonths:
      type: [integer, 'null']
      minimum: 1
      maximum: 60
      description: How long a card is valid after it is delivered; null for no end.
    sellOnline:
      type: boolean
GiftCardRow:
  type: object
  required: [id, codeLast4, initialMinor, balanceMinor, currency, status, createdAt]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    codeLast4:
      type: string
      description: '`----` until the card is delivered.'
    initialMinor:
      type: integer
      format: int64
    balanceMinor:
      type: integer
      format: int64
    currency:
      type: string
    status:
      type: string
      enum: [PENDING_DELIVERY, ACTIVE, DEPLETED, EXPIRED, VOID]
    recipientName:
      type: [string, 'null']
    purchaserName:
      type: [string, 'null']
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
    deliverAt:
      $ref: ../common/schemas.yaml#/Instant
    deliveredAt:
      $ref: ../common/schemas.yaml#/Instant
    expiresAt:
      $ref: ../common/schemas.yaml#/Instant
GiftCardPage:
  type: object
  required: [items, page]
  properties:
    items:
      type: array
      items:
        $ref: '#/GiftCardRow'
    page:
      $ref: ../common/schemas.yaml#/PageInfo
GiftCardOffer:
  type: object
  required: [available, presetsMinor]
  properties:
    available:
      type: boolean
    name:
      type: [string, 'null']
    currency:
      type: [string, 'null']
    presetsMinor:
      type: array
      items:
        type: integer
        format: int64
    minMinor:
      type: [integer, 'null']
      format: int64
    maxMinor:
      type: [integer, 'null']
      format: int64
    validityMonths:
      type: [integer, 'null']
GiftCardPurchaseInput:
  type: object
  required: [locationId, amountMinor]
  properties:
    locationId:
      $ref: ../common/schemas.yaml#/Uuid
    amountMinor:
      type: integer
      format: int64
      minimum: 1
    recipientName:
      type: string
      maxLength: 120
    recipientPhone:
      $ref: ../common/schemas.yaml#/PhoneE164
    recipientEmail:
      type: string
      format: email
      maxLength: 200
    message:
      type: string
      maxLength: 500
    deliverAt:
      $ref: ../common/schemas.yaml#/Instant
GiftCardPurchase:
  type: object
  required: [cardId, orderId, payUrl, expiresAt]
  properties:
    cardId:
      $ref: ../common/schemas.yaml#/Uuid
    orderId:
      $ref: ../common/schemas.yaml#/Uuid
    payUrl:
      type: string
      format: uri
      description: The payment link to open to pay.
    expiresAt:
      $ref: ../common/schemas.yaml#/Instant
