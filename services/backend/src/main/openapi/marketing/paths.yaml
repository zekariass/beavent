      '204':
        description: Deleted.
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
marketingConsent:
  get:
    tags: [Marketing]
    operationId: getMarketingConsent
    summary: Whether the client agreed to hear from the business by text message
    description: Needs `marketing.manage`.
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: customerId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/MarketingConsent
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
  put:
    tags: [Marketing]
    operationId: recordMarketingConsent
    summary: Record that the client agrees (or no longer agrees) to hear from the business
    description: |
      Needs `marketing.manage`. The business attests that the client agreed (for example on a form); the note is kept
      as evidence and the change is audited. A client who stops from a message's stop link is recorded the same way.
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: customerId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/MarketingConsentInput
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/MarketingConsent
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
publicLink:
  get:
    tags: [Marketing]
    operationId: followLink
    summary: Count a click on a link from a message or a shared link, and say where it leads
    description: Public. The web platform turns the answer into a redirect.
    security: []
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/LinkTarget
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '429':
        $ref: ../common/responses.yaml#/TooManyRequests
publicStop:
  get:
    tags: [Marketing]
    operationId: getStopPage
    summary: Which business a stop link is from
    description: Public. Does not stop anything, so a link preview cannot.
    security: []
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/StopPage
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '429':
        $ref: ../common/responses.yaml#/TooManyRequests
  post:
    tags: [Marketing]
    operationId: stopMessages
    summary: Stop hearing from the business by text message
    description: Public. Withdraws the person's agreement, turns off news and offers for a follower, and holds every queued message.
    security: []
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    responses:
      '204':
        description: Stopped.
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '429':
        $ref: ../common/responses.yaml#/TooManyRequests
