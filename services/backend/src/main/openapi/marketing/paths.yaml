marketingLink:
  delete:
    tags: [Marketing]
    operationId: deleteTrackingLink
    summary: Delete a link
    description: Needs `marketing.manage`.
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: linkId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
