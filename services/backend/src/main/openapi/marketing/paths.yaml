marketingAudience:
  get:
    tags: [Marketing]
    operationId: getMarketingAudience
    summary: How many people a campaign to this audience would reach
    description: Needs `marketing.manage`. People who asked to stop are counted apart.
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: audience
        in: query
        required: true
        schema:
          $ref: ./schemas.yaml#/Audience
      - name: days
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1095
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AudienceCount
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
marketingCampaigns:
  get:
    tags: [Marketing]
    operationId: listCampaigns
    summary: The business's campaigns, newest first
    description: Needs `marketing.manage`.
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CampaignList
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
  post:
    tags: [Marketing]
    operationId: createCampaign
    summary: Start a campaign as a draft
    description: Needs `marketing.manage`. Nothing is sent until the campaign is scheduled.
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/CampaignInput
    responses:
      '201':
        description: Created.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Campaign
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
marketingCampaign:
  get:
    tags: [Marketing]
    operationId: getCampaign
    summary: A campaign with what became of its messages
    description: Needs `marketing.manage`.
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: campaignId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Campaign
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
  put:
    tags: [Marketing]
    operationId: updateCampaign
    summary: Change a draft
    description: Needs `marketing.manage`. A campaign that was started cannot be changed (`CONFLICT`).
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: campaignId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/CampaignInput
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Campaign
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
  delete:
    tags: [Marketing]
    operationId: deleteCampaign
    summary: Delete a draft
    description: Needs `marketing.manage`. Only a draft (or a cancelled campaign nobody was queued for) can be deleted.
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: campaignId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '204':
        description: Deleted.
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
marketingCampaignPreview:
  get:
    tags: [Marketing]
    operationId: previewCampaign
    summary: How the message reads in each language, with the link and the stop line
    description: Needs `marketing.manage`.
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: campaignId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/MessagePreviewList
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
marketingCampaignTest:
  post:
    tags: [Marketing]
    operationId: testCampaign
    summary: Send the message to your own confirmed phone
    description: Needs `marketing.manage`. Ten test messages a day per person (`RATE_LIMITED` after).
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: campaignId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/MessagePreview
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
      '429':
        $ref: ../common/responses.yaml#/TooManyRequests
marketingCampaignSchedule:
  post:
    tags: [Marketing]
    operationId: scheduleCampaign
    summary: Send the campaign now or at a time
    description: |
      Needs `marketing.manage`. Messages go between 08:00 and 20:00 in the place's time, by text message, and never to
      someone who asked to stop. At most 3 campaigns a day (`CONSTRAINT_VIOLATION`), and not to an empty audience.
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: campaignId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/ScheduleInput
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Campaign
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
marketingCampaignCancel:
  post:
    tags: [Marketing]
    operationId: cancelCampaign
    summary: Cancel a campaign; messages not yet sent are not sent
    description: Needs `marketing.manage`.
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: campaignId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Campaign
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
marketingLinks:
