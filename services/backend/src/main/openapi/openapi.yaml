openapi: 3.1.0
info:
  title: Beavent API
  version: 0.1.0
  summary: One API for booking services and selling events (docs/03 §2.4).
  description: |
    Conventions
    - JSON fields are camelCase. Money is `{ "amountMinor": 150000, "currency": "ETB" }` (integer minor units).
    - Instants are RFC 3339 UTC; local rules carry an IANA time zone. The Ethiopian calendar is display-only.
    - Partner (organization) endpoints live under `/v1/orgs/{orgId}`; the server checks membership and
      permission on every call and the database enforces row-level isolation.
    - Errors are `application/problem+json` with a stable `code` (see `Problem`).
    - POSTs that create orders, payments, refunds, payouts or tickets require `Idempotency-Key`.
    - Updates to versioned resources require `If-Match` with the `ETag` from the last read.
    - Lists use cursor pagination (`cursor`, `limit`).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /
    description: "Same origin (local development: http://localhost:8080)"
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Sign-in, tokens and sessions
  - name: Me
    description: The signed-in person
  - name: Organizations
    description: Partner workspaces (businesses, freelancers, organizers)
  - name: Team access
    description: Members, roles, invitations
  - name: Verification
    description: Business verification (KYB)
  - name: Catalogue
    description: Services, variants, prices, add-ons, bundles, resources and galleries
  - name: Team
    description: Team profiles, pricing levels, working hours, shifts, time off and the rota
  - name: Booking policies
    description: Notice, horizon, slots, deposits, cancellation and no-show rules
  - name: Availability
    description: Which times can be booked, and with whom (public)
  - name: Calendar
    description: The business's calendar and front-desk status changes
  - name: Booking
    description: Holding a time, booking it, and the person's own appointments
  - name: Clients
    description: The business's clients — details, notes and alerts, tags, history, merging, importing, forms and patch tests
  - name: Marketplace
    description: What the public sees of a business (venue pages)
  - name: Discovery
    description: Search over places to book and things to do (public)
  - name: Files
    description: Uploads (pre-signed), processing status, signed download URLs
  - name: Admin
    description: Admin console (platform staff only; admin-console token from a multi-factor sign-in)
  - name: Reference
    description: Markets, languages, categories, administrative areas
  - name: Payments
    description: Payment provider notifications (ArifPay by default, or Chapa), banks, and how a business gets paid
