OrgId:
  name: orgId
  in: path
  required: true
  schema:
    $ref: ./schemas.yaml#/Uuid
Cursor:
  name: cursor
  in: query
  required: false
  schema:
    type: string
    maxLength: 1024
Limit:
  name: limit
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 25
IdempotencyKey:
  name: Idempotency-Key
  in: header
  required: true
  description: Unique per logical request (8-200 characters). Retries must reuse it with the same body.
  schema:
    type: string
    pattern: ^[A-Za-z0-9_.:-]{8,200}$
IfMatch:
  name: If-Match
  in: header
  required: true
  description: ETag of the version being updated.
  schema:
    type: string
AcceptLanguage:
  name: Accept-Language
  in: header
  required: false
  schema:
    type: string
