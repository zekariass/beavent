bookingPolicies:
  get:
    tags: [Booking policies]
    operationId: listBookingPolicies
    summary: All booking policies (organization default, per location, per service)
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
    responses:
      '200':
        description: Policies.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/BookingPolicyList
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
  put:
    tags: [Booking policies]
    operationId: setBookingPolicy
    summary: Create or replace the policy for a scope (organization, location, service, or both)
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/BookingPolicyInput
    responses:
      '200':
        description: Saved.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/BookingPolicy
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
bookingPolicy:
  delete:
    tags: [Booking policies]
    operationId: deleteBookingPolicy
    summary: Remove a location or service policy (the next broader one applies again)
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: policyId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '204':
        $ref: ../common/responses.yaml#/NoContent
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
effectivePolicy:
  get:
    tags: [Booking policies]
    operationId: getEffectiveBookingPolicy
    summary: The policy that applies to a service at a location (most specific wins)
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: locationId
        in: query
        required: false
        schema:
          $ref: ../common/schemas.yaml#/Uuid
      - name: serviceId
        in: query
        required: false
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '200':
        description: Policy, with the scope it came from.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/BookingPolicy
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
publicAvailability:
  post:
    tags: [Availability]
    operationId: searchAvailability
    summary: Which start times can be booked at a location, and with whom
    description: |
      Public (no sign-in). Plans one person's ordered services back to back and lists the start times that work, in
      start order, with the person assigned to each service ("anyone" picks the first available). The answer is
      advisory: booking can still return `SLOT_TAKEN` if someone else is faster. Times are instants; the grid and the
      days are in the location's time zone.
    security: []
    parameters:
      - name: locationId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/AvailabilityQuery
    responses:
      '200':
        description: Bookable times.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AvailabilityResult
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
      '429':
        $ref: ../common/responses.yaml#/TooManyRequests
publicHolds:
  post:
    tags: [Booking]
    operationId: holdTime
    summary: Hold a time for a few minutes while the person signs in and confirms
    description: |
      Public. Re-checks the time with the availability engine and reserves it for 10 minutes. Keep `holderKey`: it
      proves the hold is yours when you confirm or release it. `SLOT_TAKEN` means the time was taken meanwhile: ask
      availability again.
    security: []
    parameters:
      - name: locationId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/HoldInput
    responses:
      '201':
        description: Held.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Hold
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
      '429':
        $ref: ../common/responses.yaml#/TooManyRequests
publicHold:
  delete:
    tags: [Booking]
    operationId: releaseHold
    summary: Let go of a hold early (unknown, expired or converted holds are ignored)
    security: []
    parameters:
      - name: locationId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
      - name: holdId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
      - name: X-Hold-Key
        in: header
        required: true
        schema:
          type: string
    responses:
      '204':
        $ref: ../common/responses.yaml#/NoContent
      '404':
        $ref: ../common/responses.yaml#/NotFound
myAppointments:
  get:
    tags: [Booking]
    operationId: listMyAppointments
    summary: The signed-in person's appointments, newest first
    responses:
      '200':
        description: Appointments.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/MyAppointmentList
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
  post:
    tags: [Booking]
    operationId: bookAppointment
    summary: Turn a hold into an appointment (pay at the venue)
    description: |
      The signed-in person becomes the business's customer. `CONFIRMED`, or `REQUESTED` when the business confirms
      each booking itself. Repeating the call for the same hold returns the same appointment (`200`).
      `HOLD_EXPIRED` means the hold ran out: hold a time again. `403` when the business has blocked the person from
      booking online (they book by phone). `PATCH_TEST_REQUIRED` (422) when a service needs a patch test and the
      person has no passed test valid on the day.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/BookInput
    responses:
      '200':
        description: Already booked with this hold.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Appointment
      '201':
        description: Booked.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Appointment
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
myAppointment:
  get:
    tags: [Booking]
    operationId: getMyAppointment
    summary: One of the signed-in person's appointments, with what cancelling now would mean
    parameters:
      - $ref: '#/AppointmentIdParam'
    responses:
      '200':
        description: The appointment.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AppointmentDetail
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '404':
        $ref: ../common/responses.yaml#/NotFound
myAppointmentCancel:
  post:
    tags: [Booking]
    operationId: cancelMyAppointment
    summary: Cancel (free before the free-cancellation time, otherwise the late fee is recorded)
    parameters:
      - $ref: '#/AppointmentIdParam'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              reason:
                type: string
                maxLength: 500
    responses:
      '200':
        description: Cancelled.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AppointmentDetail
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
myAppointmentReschedule:
  post:
    tags: [Booking]
    operationId: rescheduleMyAppointment
    summary: Move to another time with the same services (allowed until the free-cancellation time)
    description: |
      Ask availability for the same services first. The person the customer chose stays; "anyone" may become someone
      else. Prices stay as booked. `SLOT_TAKEN` leaves the appointment unchanged.
    parameters:
      - $ref: '#/AppointmentIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [start]
            properties:
              start:
                $ref: ../common/schemas.yaml#/Instant
    responses:
      '200':
        description: Moved.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AppointmentDetail
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
AppointmentIdParam:
  name: appointmentId
  in: path
  required: true
  schema:
    $ref: ../common/schemas.yaml#/Uuid
requestAccept:
  post:
    tags: [Booking]
    operationId: acceptBookingRequest
    summary: Accept a booking request (needs appointments.manage)
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - $ref: '#/AppointmentIdParam'
    responses:
      '200':
        description: Accepted.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AppointmentStatus
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
requestDecline:
  post:
    tags: [Booking]
    operationId: declineBookingRequest
    summary: Decline a booking request; the time is freed (needs appointments.manage)
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - $ref: '#/AppointmentIdParam'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              reason:
                type: string
                maxLength: 500
    responses:
      '200':
        description: Declined.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AppointmentStatus
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
calendar:
  get:
    tags: [Calendar]
    operationId: getCalendar
    summary: A location's calendar for one to seven days (team, working time, appointments, blocks)
    description: |
      `calendar.view_all` sees everyone at the location; `calendar.view_own` only their own column and appointments.
      Customer phone numbers need `customers.contact_details`. Cancelled, expired and declined appointments are left out.
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: locationId
        in: query
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        description: Last local date, inclusive (default `from`).
        schema:
          type: string
          format: date
    responses:
      '200':
        description: The calendar.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Calendar
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
appointmentStatus:
  post:
    tags: [Calendar]
    operationId: changeAppointmentStatus
    summary: Arrived, started, completed or no-show (needs appointments.manage, or manage_own for your own)
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - $ref: '#/AppointmentIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status:
                type: string
                enum: [ARRIVED, IN_PROGRESS, COMPLETED, NO_SHOW]
    responses:
      '200':
        description: Changed.
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ARRIVED, IN_PROGRESS, COMPLETED, NO_SHOW]
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
deskAppointments:
  post:
    tags: [Calendar]
    operationId: bookAtTheDesk
    summary: Book a walk-in or phone customer (needs appointments.manage, or manage_own in your own column)
    description: |
      Front-desk rules: any five-minute start, no notice or horizon, services hidden from online booking allowed.
      Working time, opening hours and the calendar apply: a busy time is `SLOT_TAKEN` unless `bookAnyway`, which
      writes a deliberate overlap. `notifyCustomer` (default true) sends the confirmation; reminders follow anyway.
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/DeskBookingInput
    responses:
      '201':
        description: Booked.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/DeskBooking
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
deskCancel:
  post:
    tags: [Calendar]
    operationId: cancelAtTheDesk
    summary: Cancel a visit, the rest of its series, or its whole group (no fee; the business cancels)
    description: |
      `scope` ONE (default), FOLLOWING (this and the later visits of the series; the customer gets one message) or GROUP.
      Booked visits that have not started can be cancelled. The times are freed at once.
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - $ref: '#/AppointmentIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              scope:
                type: string
                enum: [ONE, FOLLOWING, GROUP]
              reason:
                type: string
                maxLength: 500
              notifyCustomer:
                type: boolean
                default: true
    responses:
      '200':
        description: Cancelled.
        content:
          application/json:
            schema:
              type: object
              required: [cancelled]
              properties:
                cancelled:
                  type: array
                  items:
                    $ref: ../common/schemas.yaml#/Uuid
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
deskMove:
  post:
    tags: [Calendar]
    operationId: moveAppointment
    summary: Move an appointment to another time (and optionally another person); prices stay as booked
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - $ref: '#/AppointmentIdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [start]
            properties:
              start:
                $ref: ../common/schemas.yaml#/Instant
              staffId:
                $ref: ../common/schemas.yaml#/Uuid
              bookAnyway:
                type: boolean
              notifyCustomer:
                type: boolean
    responses:
      '204':
        $ref: ../common/responses.yaml#/NoContent
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
blocks:
  post:
    tags: [Calendar]
    operationId: blockTime
    summary: Block a person's time (break, meeting, …); refused when it overlaps their bookings
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [locationId, staffId, start, end, reason]
            properties:
              locationId:
                $ref: ../common/schemas.yaml#/Uuid
              staffId:
                $ref: ../common/schemas.yaml#/Uuid
              start:
                $ref: ../common/schemas.yaml#/Instant
              end:
                $ref: ../common/schemas.yaml#/Instant
              reason:
                type: string
                enum: [BREAK, MEETING, TRAINING, PERSONAL, MAINTENANCE, OTHER]
              title:
                type: string
                maxLength: 120
    responses:
      '201':
        description: Blocked.
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  $ref: ../common/schemas.yaml#/Uuid
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '409':
        $ref: ../common/responses.yaml#/Conflict
block:
  delete:
    tags: [Calendar]
    operationId: unblockTime
    summary: Remove a block
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: blockId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '204':
        $ref: ../common/responses.yaml#/NoContent
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
calendarStream:
  get:
    tags: [Calendar]
    operationId: streamCalendar
    summary: Live updates for a location's calendar (server-sent events)
    description: |
      Sends `ready`, then `changed` (data `{locationId, what, at}`) whenever an appointment or block at the location
      changes; reload the calendar then. A comment every 25 s keeps the connection open; the stream closes after 30
      minutes (reconnect). Needs calendar.view_all or calendar.view_own.
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
      - name: locationId
        in: query
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '200':
        description: An event stream.
        content:
          text/event-stream:
            schema:
              type: string
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
myWaitlist:
  get:
    tags: [Booking]
    operationId: listMyWaitlist
    summary: The person's waitlists (waiting or with an offer), across businesses
    responses:
      '200':
        description: Entries.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/WaitlistList
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
  post:
    tags: [Booking]
    operationId: joinWaitlist
    summary: Join a location's waitlist for a service on some days and parts of the day (S-15)
    description: |
      When a matching time becomes free, the oldest entry gets an offer: the time is held for 15 minutes and the
      person gets a text message with a link. At most 5 active entries per business.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/WaitlistJoin
    responses:
      '201':
        description: Joined.
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  $ref: ../common/schemas.yaml#/Uuid
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
myWaitlistEntry:
  parameters:
    - name: entryId
      in: path
      required: true
      schema:
        $ref: ../common/schemas.yaml#/Uuid
  get:
    tags: [Booking]
    operationId: getMyWaitlistEntry
    summary: One of the person's waitlist entries, with its open offer
    responses:
      '200':
        description: The entry.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/WaitlistEntry
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '404':
        $ref: ../common/responses.yaml#/NotFound
  delete:
    tags: [Booking]
    operationId: leaveWaitlist
    summary: Leave the waitlist (an open offer is let go)
    responses:
      '204':
        $ref: ../common/responses.yaml#/NoContent
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '404':
        $ref: ../common/responses.yaml#/NotFound
myWaitlistAccept:
  post:
    tags: [Booking]
    operationId: acceptWaitlistOffer
    summary: Book the offered time
    description: '`HOLD_EXPIRED` when the offer ran out (the time went to the next person).'
    parameters:
      - name: entryId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '201':
        description: Booked.
        content:
          application/json:
            schema:
              type: object
              required: [appointmentId, reference, status]
              properties:
                appointmentId:
                  $ref: ../common/schemas.yaml#/Uuid
                reference:
                  type: string
                status:
                  type: string
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
      '422':
        $ref: ../common/responses.yaml#/Unprocessable
myWaitlistDecline:
  post:
    tags: [Booking]
    operationId: declineWaitlistOffer
    summary: Not this time — the time goes to the next person; the entry keeps waiting
    parameters:
      - name: entryId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '204':
