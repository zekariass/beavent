Deposit:
  type: object
  required: [mode]
  properties:
    mode:
      type: string
      enum: [NONE, PERCENT, FIXED, FULL]
    percent:
      type: number
      exclusiveMinimum: 0
      maximum: 100
      description: Required for PERCENT.
    fixedMinor:
      type: integer
      format: int64
      minimum: 1
      description: Required for FIXED (in the market's price currency).
    appliesTo:
      type: string
      enum: [EVERYONE, NEW_CUSTOMERS, MARKETPLACE_CUSTOMERS, FLAGGED_CUSTOMERS]
      default: EVERYONE
BookingPolicyInput:
  type: object
  description: Leave locationId and serviceId out for the organization default.
  properties:
    locationId:
      $ref: ../common/schemas.yaml#/Uuid
    serviceId:
      $ref: ../common/schemas.yaml#/Uuid
    minNoticeMinutes:
      type: integer
      minimum: 0
      maximum: 43200
      default: 60
    maxAdvanceDays:
      type: integer
      minimum: 1
      maximum: 730
      default: 90
    slotIntervalMinutes:
      type: integer
      enum: [5, 10, 15, 20, 30, 60]
      default: 15
    requiresApproval:
      type: boolean
      description: Request-to-book; the business confirms each booking.
    allowPayAtVenue:
      type: boolean
      default: true
    deposit:
      $ref: '#/Deposit'
    cancellationWindowMinutes:
      type: integer
      minimum: 0
      maximum: 43200
      default: 1440
      description: Free cancellation until this long before the start.
    lateCancelFeePercent:
      type: number
      minimum: 0
      maximum: 100
    noShowFeePercent:
      type: number
      minimum: 0
      maximum: 100
    policyText:
      $ref: ../common/schemas.yaml#/LocalizedText
BookingPolicy:
  type: object
  required: [scope, minNoticeMinutes, maxAdvanceDays, slotIntervalMinutes, requiresApproval, allowPayAtVenue, deposit, cancellationWindowMinutes, lateCancelFeePercent, noShowFeePercent, policyText]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    scope:
      type: string
      enum: [ORGANIZATION, LOCATION, SERVICE, SERVICE_AND_LOCATION, PLATFORM_DEFAULT]
    locationId:
      $ref: ../common/schemas.yaml#/Uuid
    serviceId:
      $ref: ../common/schemas.yaml#/Uuid
    minNoticeMinutes:
      type: integer
    maxAdvanceDays:
      type: integer
    slotIntervalMinutes:
      type: integer
    requiresApproval:
      type: boolean
    allowPayAtVenue:
      type: boolean
    deposit:
      $ref: '#/Deposit'
    currency:
      $ref: ../common/schemas.yaml#/CurrencyCode
    cancellationWindowMinutes:
      type: integer
    lateCancelFeePercent:
      type: number
    noShowFeePercent:
      type: number
    policyText:
      $ref: ../common/schemas.yaml#/LocalizedText
BookingPolicyList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/BookingPolicy'
AvailabilityItem:
  type: object
  required: [variantId]
  properties:
    variantId:
      $ref: ../common/schemas.yaml#/Uuid
    addonIds:
      type: array
      maxItems: 10
      items:
        $ref: ../common/schemas.yaml#/Uuid
    staffId:
      description: The chosen person; leave out for anyone available.
      $ref: ../common/schemas.yaml#/Uuid
AvailabilityQuery:
  type: object
  required: [items, from, to]
  properties:
    items:
      type: array
      minItems: 1
      maxItems: 6
      description: Services in the order they are done, back to back.
      items:
        $ref: '#/AvailabilityItem'
    from:
      type: string
      format: date
      description: First local date (the location's time zone).
    to:
      type: string
      format: date
      description: Last local date, inclusive. At most 14 days from `from`.
    serviceAreaId:
      description: Set for a visit at the customer's place; leave out for the venue.
      $ref: ../common/schemas.yaml#/Uuid
AvailabilityAssignment:
  type: object
  required: [variantId, staffId]
  properties:
    variantId:
      $ref: ../common/schemas.yaml#/Uuid
    staffId:
      $ref: ../common/schemas.yaml#/Uuid
AvailabilitySlot:
  type: object
  required: [start, end, items]
  properties:
    start:
      $ref: ../common/schemas.yaml#/Instant
    end:
      $ref: ../common/schemas.yaml#/Instant
    items:
      type: array
      items:
        $ref: '#/AvailabilityAssignment'
AvailabilityResult:
  type: object
  required: [timezone, slots]
  properties:
    timezone:
      type: string
      example: Africa/Addis_Ababa
    slots:
      type: array
      items:
        $ref: '#/AvailabilitySlot'
HoldInput:
  type: object
  required: [items, start]
  properties:
    items:
      type: array
      minItems: 1
      maxItems: 6
      items:
        $ref: '#/AvailabilityItem'
    start:
      $ref: ../common/schemas.yaml#/Instant
    serviceAreaId:
      $ref: ../common/schemas.yaml#/Uuid
BookingAddon:
  type: object
  required: [id, name, durationMinutes, priceMinor]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    name:
      type: string
    durationMinutes:
      type: integer
    priceMinor:
      type: integer
      format: int64
BookingItem:
  type: object
  required: [variantId, serviceName, staffId, staffName, staffRequested, start, end, priceMinor, currency, addons]
  properties:
    variantId:
      $ref: ../common/schemas.yaml#/Uuid
    serviceName:
      type: string
    variantName:
      type: [string, 'null']
    staffId:
      $ref: ../common/schemas.yaml#/Uuid
    staffName:
      type: string
    staffRequested:
      type: boolean
    start:
      $ref: ../common/schemas.yaml#/Instant
    end:
      $ref: ../common/schemas.yaml#/Instant
    priceMinor:
      type: integer
      format: int64
      description: The service's price for this person here; add-ons are listed separately.
    currency:
      $ref: ../common/schemas.yaml#/CurrencyCode
    addons:
      type: array
      items:
        $ref: '#/BookingAddon'
BookingTerms:
  type: object
  required: [requiresApproval, allowPayAtVenue, depositMode, cancellationWindowMinutes, freeCancellationUntil]
  description: The terms frozen in the appointment; several services apply the strictest rule of any.
  properties:
    requiresApproval:
      type: boolean
    allowPayAtVenue:
      type: boolean
    depositMode:
      type: string
      enum: [NONE, PERCENT, FIXED, FULL]
    cancellationWindowMinutes:
      type: integer
    freeCancellationUntil:
      $ref: ../common/schemas.yaml#/Instant
    lateCancelFeePercent:
      type: number
    noShowFeePercent:
      type: number
BookingSummary:
  type: object
  required: [locationId, timezone, deliveryMode, start, end, items, totalMinor, currency, policy]
  properties:
    locationId:
      $ref: ../common/schemas.yaml#/Uuid
    timezone:
      type: string
    deliveryMode:
      type: string
      enum: [ON_PREMISES, AT_CUSTOMER]
    start:
      $ref: ../common/schemas.yaml#/Instant
    end:
      $ref: ../common/schemas.yaml#/Instant
    items:
      type: array
      items:
        $ref: '#/BookingItem'
    totalMinor:
      type: integer
      format: int64
      description: All-in total (services and add-ons).
    currency:
      $ref: ../common/schemas.yaml#/CurrencyCode
    policy:
      $ref: '#/BookingTerms'
PaymentTerms:
  type: object
  description: |
    What the customer pays now to book, and what is left for the venue. Shown on the review step; a person who is not
    signed in yet counts as a new customer (a deposit for new customers is shown), and confirming decides for real.
  required: [depositMinor, atVenueMinor, totalMinor, currency]
  properties:
    depositMinor:
      type: integer
      format: int64
      description: Paid online now to confirm the booking (the deposit, or the whole price), with the platform's fees.
    atVenueMinor:
      type: integer
      format: int64
    totalMinor:
      type: integer
      format: int64
      description: The all-in price.
    currency:
      type: string
PaymentStatus:
  type: object
  description: Where the online payment of a booking stands.
  required: [state, dueNowMinor, paidMinor, atVenueMinor, currency]
  properties:
    state:
      type: string
      enum: [NOT_REQUIRED, AWAITING_PAYMENT, PAID, FAILED, EXPIRED]
      description: |
        `AWAITING_PAYMENT`: nothing started yet, or the person is paying. `FAILED`: the last attempt was declined; they
        may try again while the time is held. `EXPIRED`: the time was not paid for in time.
    dueNowMinor:
      type: integer
      format: int64
    paidMinor:
      type: integer
      format: int64
    atVenueMinor:
      type: integer
      format: int64
      description: Left to pay at the venue.
    currency:
      type: string
    expiresAt:
      description: Until when the time is held for payment.
      $ref: ../common/schemas.yaml#/Instant
    redirectUrl:
      type: [string, 'null']
      format: uri
      description: The provider's page of the attempt in progress, to reopen it.
    balanceMinor:
      type: integer
      format: int64
      description: What the signed-in person could pay now from their balance with the business (0 for none).
PaymentStart:
  type: object
  required: [attemptId, expiresAt, amountMinor, currency]
  properties:
    attemptId:
      $ref: ../common/schemas.yaml#/Uuid
    redirectUrl:
      type: [string, 'null']
      format: uri
      description: The provider's page to send the person to; they come back to the booking's payment page.
    expiresAt:
      $ref: ../common/schemas.yaml#/Instant
    amountMinor:
      type: integer
      format: int64
    currency:
      type: string
Hold:
  type: object
  required: [holdId, holderKey, expiresAt, booking]
  properties:
    holdId:
      $ref: ../common/schemas.yaml#/Uuid
    holderKey:
      type: string
      description: Proof that the hold is yours; send it to confirm or release.
    expiresAt:
      $ref: ../common/schemas.yaml#/Instant
    booking:
      $ref: '#/BookingSummary'
    payment:
      description: What would be paid now to book; absent when nothing is due online.
      $ref: '#/PaymentTerms'
BookInput:
  type: object
  required: [locationId, holdId, holderKey]
  properties:
    locationId:
      $ref: ../common/schemas.yaml#/Uuid
    holdId:
      $ref: ../common/schemas.yaml#/Uuid
    holderKey:
      type: string
    note:
      type: string
      maxLength: 500
      description: For the business ("first time, sensitive scalp").
Appointment:
  type: object
  required: [id, reference, status, booking]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    reference:
      type: string
      description: Six characters people can read out over the phone.
    status:
      type: string
      enum: [PENDING_PAYMENT, REQUESTED, CONFIRMED]
      description: |
        `PENDING_PAYMENT`: the policy asks this customer for a deposit; the time is held until `payment.expiresAt` and
        confirmed when the payment arrives (start it with `POST …/payment`).
    booking:
      $ref: '#/BookingSummary'
    payment:
      description: Present for `PENDING_PAYMENT`.
      $ref: '#/PaymentStatus'
MyAppointmentPlace:
  type: object
  required: [locationId, businessName, businessSlug, locationName, locationSlug]
  properties:
    locationId:
      $ref: ../common/schemas.yaml#/Uuid
    businessName:
      type: string
    businessSlug:
      type: string
    locationName:
      type: string
    locationSlug:
      type: string
    landmark:
      type: [string, 'null']
    phone:
      type: [string, 'null']
MyAppointmentItem:
  type: object
  required: [variantId, serviceName, start, end, priceMinor, currency]
  properties:
    variantId:
      $ref: ../common/schemas.yaml#/Uuid
    serviceName:
      type: string
    variantName:
      type: [string, 'null']
    staffName:
      type: [string, 'null']
    start:
      $ref: ../common/schemas.yaml#/Instant
    end:
      $ref: ../common/schemas.yaml#/Instant
    priceMinor:
      type: integer
      format: int64
    currency:
      $ref: ../common/schemas.yaml#/CurrencyCode
MyAppointment:
  type: object
  required: [id, reference, status, start, end, timezone, items]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    reference:
      type: string
    status:
      type: string
      enum: [PENDING_PAYMENT, REQUESTED, CONFIRMED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW, EXPIRED, DECLINED]
    start:
      $ref: ../common/schemas.yaml#/Instant
    end:
      $ref: ../common/schemas.yaml#/Instant
    timezone:
      type: string
    place:
      $ref: '#/MyAppointmentPlace'
    items:
      type: array
      items:
        $ref: '#/MyAppointmentItem'
MyAppointmentList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/MyAppointment'
CancellationPreview:
  type: object
  required: [allowed, free, freeUntil, feeMinor, refundMinor, keptMinor]
  properties:
    allowed:
      type: boolean
      description: False once the visit has started or the appointment is no longer active.
    free:
      type: boolean
    freeUntil:
      $ref: ../common/schemas.yaml#/Instant
    feeMinor:
      type: integer
      format: int64
      description: Late-cancellation fee if cancelled now (0 when free), on the whole price.
    currency:
      type: [string, 'null']
    refundMinor:
      type: integer
      format: int64
      description: What of the deposit paid comes back if cancelled now (0 when nothing was paid online).
    keptMinor:
      type: integer
      format: int64
      description: What of the deposit paid the business keeps if cancelled now (the late-cancellation fee, at most what was paid).
AppointmentDetail:
  type: object
  required: [id, reference, status, start, end, timezone, booking, cancellation, canReschedule]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    reference:
      type: string
    status:
      type: string
      enum: [PENDING_PAYMENT, REQUESTED, CONFIRMED, ARRIVED, IN_PROGRESS, COMPLETED, CANCELLED, NO_SHOW, EXPIRED, DECLINED]
    start:
      $ref: ../common/schemas.yaml#/Instant
    end:
      $ref: ../common/schemas.yaml#/Instant
    timezone:
      type: string
    note:
      type: [string, 'null']
    place:
      $ref: '#/MyAppointmentPlace'
    booking:
      $ref: '#/BookingSummary'
    cancellation:
      $ref: '#/CancellationPreview'
    canReschedule:
      type: boolean
    payment:
      description: Present when the booking has an order to pay online.
      $ref: '#/PaymentStatus'
    refund:
      description: |
        Present once a cancelled, declined or missed booking with a deposit has been settled (a moment after it
        happens) or a refund exists: what goes back to the customer.
      $ref: '#/AppointmentRefund'
AppointmentRefund:
  type: object
  required: [amountMinor, currency, state]
  properties:
    amountMinor:
      type: integer
      format: int64
    currency:
      type: string
    state:
      type: string
      enum: [ON_THE_WAY, SENT, CREDITED, NONE]
      description: '`CREDITED`: back on a gift card or in the balance with the business. `NONE`: the business kept all of it.'
AppointmentStatus:
  type: object
  required: [status]
  properties:
    status:
      type: string
      enum: [CONFIRMED, DECLINED]
CalendarSpan:
  type: object
  required: [start, end]
  properties:
    start:
      $ref: ../common/schemas.yaml#/Instant
    end:
      $ref: ../common/schemas.yaml#/Instant
CalendarColumn:
  type: object
  required: [staffId, name, working]
  properties:
    staffId:
      $ref: ../common/schemas.yaml#/Uuid
    name:
      type: string
    color:
      type: [string, 'null']
    working:
      type: array
      items:
        $ref: '#/CalendarSpan'
CalendarStage:
  type: object
  required: [kind, staffBusy, start, end]
  properties:
    kind:
      type: string
      enum: [SERVICE, PROCESSING, FINISHING, CONSULTATION, TRAVEL]
    staffBusy:
      type: boolean
    start:
      $ref: ../common/schemas.yaml#/Instant
    end:
      $ref: ../common/schemas.yaml#/Instant
CalendarItem:
  type: object
  required: [id, serviceName, names, start, end, status, stages]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    staffId:
      oneOf:
        - $ref: ../common/schemas.yaml#/Uuid
        - type: 'null'
    serviceName:
      type: string
    variantName:
      type: [string, 'null']
    names:
      type: object
      description: Current menu names per language (`service`, `variant`); `serviceName` is the name as booked.
      properties:
        service:
          $ref: ../common/schemas.yaml#/LocalizedText
        variant:
          $ref: ../common/schemas.yaml#/LocalizedText
    start:
      $ref: ../common/schemas.yaml#/Instant
    end:
      $ref: ../common/schemas.yaml#/Instant
    status:
      type: string
      enum: [BOOKED, STARTED, DONE, CANCELLED, NO_SHOW]
    stages:
      type: array
      items:
        $ref: '#/CalendarStage'
CalendarCustomer:
  type: object
  required: [id, name, alerts]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    name:
      type: string
    phone:
      type: [string, 'null']
      description: Only with customers.contact_details.
    alerts:
      type: array
      description: The client's alert, allergy and medical notes (pinned first), to show before serving them.
      items:
        type: object
        required: [kind, body]
        properties:
          kind:
            type: string
            enum: [ALERT, ALLERGY, MEDICAL]
          body:
            type: string
CalendarAppointment:
  type: object
  required: [id, reference, status, source, start, end, customer, items, forms]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    reference:
      type: string
    status:
      type: string
      enum: [PENDING_PAYMENT, REQUESTED, CONFIRMED, ARRIVED, IN_PROGRESS, COMPLETED, NO_SHOW]
    source:
      type: string
    start:
      $ref: ../common/schemas.yaml#/Instant
    end:
      $ref: ../common/schemas.yaml#/Instant
    note:
      type: [string, 'null']
    customer:
      $ref: '#/CalendarCustomer'
    items:
      type: array
      items:
        $ref: '#/CalendarItem'
    groupId:
      oneOf:
        - $ref: ../common/schemas.yaml#/Uuid
        - type: 'null'
      description: Booked together with the other appointments of this group (same time).
    series:
      oneOf:
        - type: object
          required: [id, everyWeeks, index, count]
          properties:
            id:
              $ref: ../common/schemas.yaml#/Uuid
            everyWeeks:
              type: integer
            index:
              type: integer
              description: This visit's number among the series' active visits.
            count:
              type: integer
        - type: 'null'
    payment:
      description: Present when the booking has a deposit to pay online (paid, awaited until `expiresAt`, or expired).
      $ref: '#/PaymentStatus'
    forms:
      type: array
      description: Forms the client fills in before this visit (attached to its services), and whether they have.
      items:
        type: object
        required: [formId, title, required, done]
        properties:
          formId:
            $ref: ../common/schemas.yaml#/Uuid
          title:
            type: object
            additionalProperties:
              type: string
          required:
            type: boolean
          done:
            type: boolean
CalendarBlock:
  type: object
  required: [id, start, end, reason]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    staffId:
      type: [string, 'null']
      format: uuid
    resourceId:
      type: [string, 'null']
      format: uuid
    start:
      $ref: ../common/schemas.yaml#/Instant
    end:
      $ref: ../common/schemas.yaml#/Instant
    reason:
      type: string
      enum: [BREAK, MEETING, TRAINING, TIME_OFF, PERSONAL, MAINTENANCE, OTHER]
    title:
      type: [string, 'null']
Calendar:
  type: object
  required: [locationId, timezone, from, to, staff, appointments, blocks]
  properties:
    locationId:
      $ref: ../common/schemas.yaml#/Uuid
    timezone:
      type: string
    from:
      type: string
      format: date
    to:
      type: string
      format: date
    staff:
      type: array
      items:
        $ref: '#/CalendarColumn'
    appointments:
      type: array
      items:
        $ref: '#/CalendarAppointment'
    blocks:
      type: array
      items:
        $ref: '#/CalendarBlock'
DeskBookingInput:
  type: object
  required: [locationId, start, items, customer]
  properties:
    locationId:
      $ref: ../common/schemas.yaml#/Uuid
    start:
      $ref: ../common/schemas.yaml#/Instant
    items:
      type: array
      minItems: 1
      maxItems: 6
      items:
        type: object
        required: [variantId, staffId]
        properties:
          variantId:
            $ref: ../common/schemas.yaml#/Uuid
          staffId:
            $ref: ../common/schemas.yaml#/Uuid
          addonIds:
            type: array
            maxItems: 10
            items:
              $ref: ../common/schemas.yaml#/Uuid
    customer:
      type: object
      description: An existing customer (`customerId`) or a new one (`name`, optional `phone`; a known phone is reused).
      properties:
        customerId:
          $ref: ../common/schemas.yaml#/Uuid
        name:
          type: string
          maxLength: 120
        phone:
          $ref: ../common/schemas.yaml#/PhoneE164
    note:
      type: string
      maxLength: 500
      description: For the team only.
    source:
      type: string
      enum: [WALK_IN, PHONE]
      default: WALK_IN
    bookAnyway:
      type: boolean
      default: false
    notifyCustomer:
      type: boolean
      default: true
    guests:
      type: array
      maxItems: 9
      description: |
        A group: more people at the same time, one appointment each, booked all together or not at all (the first
        customer leads the group). Not with `repeat`.
      items:
        type: object
        required: [customer, items]
        properties:
          customer:
            $ref: '#/DeskBookingInput/properties/customer'
          items:
            $ref: '#/DeskBookingInput/properties/items'
    repeat:
      type: object
      description: |
        A series: the same visit every `everyWeeks` weeks, `count` times in all, at the same local time. Only the first
        visit sends a confirmation; reminders follow each. Not with `guests`.
      required: [everyWeeks, count]
      properties:
        everyWeeks:
          type: integer
          minimum: 1
          maximum: 4
        count:
          type: integer
          minimum: 2
          maximum: 12
    skipTaken:
      type: boolean
      description: In a series, leave out the dates that are not free instead of failing (false when absent).
DeskBooking:
  type: object
  required: [id, reference, start, end]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    reference:
      type: string
    start:
      $ref: ../common/schemas.yaml#/Instant
    end:
      $ref: ../common/schemas.yaml#/Instant
    groupId:
      oneOf:
        - $ref: ../common/schemas.yaml#/Uuid
        - type: 'null'
    seriesId:
      oneOf:
        - $ref: ../common/schemas.yaml#/Uuid
        - type: 'null'
    appointments:
      type: array
      description: Every appointment made (one for a single booking).
      items:
        type: object
        required: [id, reference, start, end]
        properties:
          id:
            $ref: ../common/schemas.yaml#/Uuid
          reference:
            type: string
          start:
            $ref: ../common/schemas.yaml#/Instant
          end:
            $ref: ../common/schemas.yaml#/Instant
    skipped:
      type: array
      description: Series dates left out because they were not free.
      items:
        $ref: ../common/schemas.yaml#/Instant
WaitlistJoin:
  type: object
  required: [locationId, variantId, days, parts]
  properties:
    locationId:
      $ref: ../common/schemas.yaml#/Uuid
    variantId:
      $ref: ../common/schemas.yaml#/Uuid
    staffId:
      oneOf:
        - $ref: ../common/schemas.yaml#/Uuid
        - type: 'null'
      description: A particular person, or anyone who does the service.
    days:
      type: array
      minItems: 1
      maxItems: 7
      description: The location's local dates, from today up to 60 days ahead.
      items:
        type: string
        format: date
    parts:
      type: array
      minItems: 1
      maxItems: 3
      description: MORNING before 12:00, AFTERNOON 12:00–17:00, EVENING from 17:00 (local time).
      items:
        type: string
        enum: [MORNING, AFTERNOON, EVENING]
WaitlistOffer:
  type: object
  required: [id, start, end, expiresAt]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    start:
      $ref: ../common/schemas.yaml#/Instant
    end:
      $ref: ../common/schemas.yaml#/Instant
    expiresAt:
      $ref: ../common/schemas.yaml#/Instant
      description: The time is held until then.
    staffName:
      type: [string, 'null']
WaitlistEntry:
  type: object
  required: [id, status, locationId, timezone, variantId, serviceName, days, parts, createdAt]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    status:
      type: string
      enum: [WAITING, OFFERED, CONVERTED, EXPIRED, CANCELLED]
    locationId:
      $ref: ../common/schemas.yaml#/Uuid
    timezone:
      type: string
    place:
      $ref: '#/MyAppointmentPlace'
    variantId:
      $ref: ../common/schemas.yaml#/Uuid
    serviceName:
      type: object
      additionalProperties:
        type: string
    variantName:
      type: object
      additionalProperties:
        type: string
    staffId:
      oneOf:
        - $ref: ../common/schemas.yaml#/Uuid
        - type: 'null'
    staffName:
      type: [string, 'null']
    customerName:
      type: [string, 'null']
      description: For the front desk.
    days:
      type: array
      items:
        type: string
        format: date
    parts:
      type: array
      items:
        type: string
        enum: [MORNING, AFTERNOON, EVENING]
    offer:
      oneOf:
        - $ref: '#/WaitlistOffer'
        - type: 'null'
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
WaitlistList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/WaitlistEntry'
PaymentLinkSent:
  type: object
  required: [url, expiresAt, amountMinor, currency, kind, sentTo]
  properties:
    url:
      type: string
      format: uri
      description: The address the customer opens; sent to them, and shown so it can also be shared by hand.
    expiresAt:
      $ref: ../common/schemas.yaml#/Instant
    amountMinor:
      type: integer
      format: int64
    currency:
      type: string
    kind:
      type: string
      enum: [DEPOSIT, FULL, BALANCE]
    sentTo:
      type: string
      enum: [SMS, EMAIL]

