StaffMe:
  type: object
  required: [userId, roles, permissions]
  properties:
    userId:
      $ref: ../common/schemas.yaml#/Uuid
    roles:
      type: array
      items:
        type: object
        required: [roleCode]
        properties:
          roleCode:
            type: string
            examples: [RISK_ANALYST]
          marketCode:
            type: string
            description: Absent = all markets.
    permissions:
      type: array
      items:
        type: string
OrgSummary:
  type: object
  required: [id, slug, displayName, kind, status, verificationStatus, marketCode, createdAt]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    slug:
      type: string
    displayName:
      type: string
    kind:
      type: string
    status:
      type: string
    verificationStatus:
      type: string
    marketCode:
      type: string
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
OrgSummaryPage:
  type: object
  required: [items, page]
  properties:
    items:
      type: array
      items:
        $ref: '#/OrgSummary'
    page:
      $ref: ../common/schemas.yaml#/PageInfo
LegalEntitySummary:
  type: object
  required: [id, countryCode, registeredName, taxRegime, verificationStatus]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    countryCode:
      type: string
    registeredName:
      type: string
    tin:
      type: string
    taxRegime:
      type: string
    verificationStatus:
      type: string
CaseSummary:
  type: object
  required: [id, subject, status, orgId, orgName, marketCode, createdAt, documentCount]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    subject:
      type: string
    status:
      type: string
      enum: [OPEN, AWAITING_INFO, IN_REVIEW, APPROVED, REJECTED, EXPIRED]
    orgId:
      $ref: ../common/schemas.yaml#/Uuid
    orgName:
      type: string
    marketCode:
      type: string
    legalEntityId:
      $ref: ../common/schemas.yaml#/Uuid
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
    decidedAt:
      $ref: ../common/schemas.yaml#/Instant
    decisionReason:
      type: string
    documentCount:
      type: integer
CaseSummaryPage:
  type: object
  required: [items, page]
  properties:
    items:
      type: array
      items:
        $ref: '#/CaseSummary'
    page:
      $ref: ../common/schemas.yaml#/PageInfo
CaseDetail:
  type: object
  required: [verificationCase, documents]
  properties:
    verificationCase:
      $ref: '#/CaseSummary'
    legalEntity:
      $ref: '#/LegalEntitySummary'
    documents:
      type: array
      items:
        type: object
        required: [id, docType, fileId, status]
        properties:
          id:
            $ref: ../common/schemas.yaml#/Uuid
          docType:
            type: string
          fileId:
            $ref: ../common/schemas.yaml#/Uuid
          status:
            type: string
          expiresOn:
            type: string
            format: date
Decision:
  type: object
  required: [decision, reason]
  properties:
    decision:
      type: string
      enum: [APPROVE, REJECT, REQUEST_INFO]
    reason:
      type: string
      minLength: 5
      maxLength: 500
      description: Recorded in the audit log and shown to the organization for rejections and requests.
AuditEntry:
  type: object
  required: [id, occurredAt, actorKind, action, targetType, targetId]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    occurredAt:
      $ref: ../common/schemas.yaml#/Instant
    actorKind:
      type: string
      enum: [USER, PLATFORM_STAFF, SYSTEM, API_CLIENT, PROVIDER]
    actorUserId:
      $ref: ../common/schemas.yaml#/Uuid
    orgId:
      $ref: ../common/schemas.yaml#/Uuid
    action:
      type: string
    targetType:
      type: string
    targetId:
      type: string
    before:
      type: object
    after:
      type: object
    reason:
      type: string
    requestId:
      type: string
AuditEntryPage:
  type: object
  required: [items, page]
  properties:
    items:
      type: array
      items:
        $ref: '#/AuditEntry'
    page:
      $ref: ../common/schemas.yaml#/PageInfo
Org360:
  type: object
  required: [organization, capabilities, memberCount, locationCount, legalEntities, verificationCases, recentAudit]
  properties:
    organization:
      $ref: '#/OrgSummary'
    capabilities:
      type: array
      items:
        type: string
    owner:
      type: object
      required: [userId]
      properties:
        userId:
          $ref: ../common/schemas.yaml#/Uuid
        displayName:
          type: string
        phone:
          type: string
    memberCount:
      type: integer
    locationCount:
      type: integer
    legalEntities:
      type: array
      items:
        $ref: '#/LegalEntitySummary'
    verificationCases:
      type: array
      items:
        $ref: '#/CaseSummary'
    recentAudit:
      type: array
      description: Empty without the audit permission.
      items:
        $ref: '#/AuditEntry'
UserSummary:
  type: object
  required: [id, status, createdAt, isStaff, membershipCount]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    phone:
      type: string
    email:
      type: string
    displayName:
      type: string
    status:
      type: string
    countryCode:
      type: string
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
    lastLoginAt:
      $ref: ../common/schemas.yaml#/Instant
    isStaff:
      type: boolean
    membershipCount:
      type: integer
UserSummaryPage:
  type: object
  required: [items, page]
  properties:
    items:
      type: array
      items:
        $ref: '#/UserSummary'
    page:
      $ref: ../common/schemas.yaml#/PageInfo
Flag:
  type: object
  required: [code, description, defaultEnabled, overrides, updatedAt]
  properties:
    code:
      type: string
    description:
      type: string
    defaultEnabled:
      type: boolean
    overrides:
      type: array
      items:
        type: object
        required: [enabled]
        properties:
          marketCode:
            type: string
          orgId:
            $ref: ../common/schemas.yaml#/Uuid
          userId:
            $ref: ../common/schemas.yaml#/Uuid
          enabled:
            type: boolean
    updatedAt:
      $ref: ../common/schemas.yaml#/Instant
FlagList:
  type: object
  required: [items]
  properties:
    items:
      type: array
      items:
        $ref: '#/Flag'
FlagUpdate:
  type: object
  required: [defaultEnabled, reason]
  properties:
    defaultEnabled:
      type: boolean
    reason:
      type: string
      minLength: 5
      maxLength: 500
PayoutAccountSummary:
  type: object
  required: [id, orgId, organization, marketCode, organizationStatus, legalEntityName, legalEntityStatus, kind, institutionName, accountName, accountNumberMasked, status, createdAt, payoutsAllowedAfter]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    orgId:
      $ref: ../common/schemas.yaml#/Uuid
    organization:
      type: string
    marketCode:
      type: string
    organizationStatus:
      type: string
    legalEntityName:
      type: string
    legalEntityStatus:
      type: string
    kind:
      type: string
    institutionName:
      type: string
    accountName:
      type: string
    accountNumberMasked:
      type: string
    status:
      type: string
      enum: [UNVERIFIED, PENDING, VERIFIED, FAILED]
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
    payoutsAllowedAfter:
      $ref: ../common/schemas.yaml#/Instant
    decisionNote:
      type: [string, 'null']
PayoutAccountSummaryPage:
  type: object
  required: [items, page]
  properties:
    items:
      type: array
      items:
        $ref: '#/PayoutAccountSummary'
    page:
      $ref: ../common/schemas.yaml#/PageInfo
PayoutReveal:
  type: object
  required: [reason]
  properties:
    reason:
      type: string
      minLength: 5
      maxLength: 500
      description: Why the full number is needed; recorded in the audit log.
AccountNumber:
  type: object
  required: [accountNumber]
  properties:
    accountNumber:
      type: string
PayoutSummary:
  type: object
  required: [id, orgId, organization, marketCode, amountMinor, currency, status, approvalReasons, institutionName, accountName, accountNumberMasked, createdAt]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    orgId:
      $ref: ../common/schemas.yaml#/Uuid
    organization:
      type: string
    marketCode:
      type: string
    amountMinor:
      type: integer
      format: int64
    currency:
      type: string
    status:
      type: string
      enum: [SCHEDULED, PENDING_APPROVAL, APPROVED, PROCESSING, PAID, FAILED, CANCELLED, RETURNED]
    approvalReasons:
      type: array
      items:
        type: string
        enum: [FIRST_PAYOUT, LARGE_AMOUNT, NEW_ACCOUNT, RISK_REVIEW]
    institutionName:
      type: string
    accountName:
      type: string
    accountNumberMasked:
      type: string
    createdAt:
      $ref: ../common/schemas.yaml#/Instant
    exportedAt:
      $ref: ../common/schemas.yaml#/Instant
    paidAt:
      $ref: ../common/schemas.yaml#/Instant
    reference:
      type: [string, 'null']
    note:
      type: [string, 'null']
PayoutSummaryPage:
  type: object
  required: [items, page]
  properties:
    items:
      type: array
      items:
        $ref: '#/PayoutSummary'
    page:
      $ref: ../common/schemas.yaml#/PageInfo
PayoutSettlement:
  type: object
  required: [outcome]
  properties:
    outcome:
      type: string
      enum: [PAID, FAILED, RETURNED]
    reference:
      type: string
      maxLength: 120
    reason:
      type: string
      maxLength: 500
PayoutExport:
  type: object
  properties:
    payoutIds:
      type: array
      items:
        $ref: ../common/schemas.yaml#/Uuid
      description: Only these, among those that are ready; all ready payouts when left out.

