adminMe:
  get:
    tags: [Admin]
    operationId: getStaffMe
    summary: The signed-in staff member, roles and permissions
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/StaffMe
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminOrgs:
  get:
    tags: [Admin]
    operationId: searchOrganizations
    summary: Search organizations (name, slug or id) in your markets
    parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - $ref: ../common/parameters.yaml#/Cursor
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/OrgSummaryPage
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminOrg:
  get:
    tags: [Admin]
    operationId: getOrganization360
    summary: "Organization 360: profile, owner, team size, verification, recent audit"
    parameters:
      - name: orgId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Org360
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
adminUsers:
  get:
    tags: [Admin]
    operationId: searchUsers
    summary: Search people by phone, email, name or id
    parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - $ref: ../common/parameters.yaml#/Cursor
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/UserSummaryPage
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminCases:
  get:
    tags: [Admin]
    operationId: listVerificationQueue
    summary: "KYB/KYC queue, oldest first (default: open cases)"
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
      - $ref: ../common/parameters.yaml#/Cursor
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CaseSummaryPage
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminCase:
  get:
    tags: [Admin]
    operationId: getVerificationCaseForReview
    summary: A verification case with its documents
    parameters:
      - name: caseId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CaseDetail
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
adminCaseDocumentUrl:
  post:
    tags: [Admin]
    operationId: createVerificationDocumentUrl
    summary: Short-lived URL to view a submitted document (audited)
    parameters:
      - name: caseId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
      - name: documentId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ../files/schemas.yaml#/AccessUrl
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
adminCaseDecision:
  post:
    tags: [Admin]
    operationId: decideVerificationCase
    summary: Approve, reject or request more information (reason required, audited)
    parameters:
      - name: caseId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/Decision
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CaseDetail
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
adminAuditLog:
  get:
    tags: [Admin]
    operationId: searchAuditLog
    summary: Audit log, newest first
    parameters:
      - name: orgId
        in: query
        required: false
        schema:
          $ref: ../common/schemas.yaml#/Uuid
      - name: actorUserId
        in: query
        required: false
        schema:
          $ref: ../common/schemas.yaml#/Uuid
      - name: action
        in: query
        required: false
        schema:
          type: string
      - name: targetId
        in: query
        required: false
        schema:
          type: string
      - $ref: ../common/parameters.yaml#/Cursor
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AuditEntryPage
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
adminFlags:
  get:
    tags: [Admin]
    operationId: listFeatureFlags
    summary: Feature flags and their overrides
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/FlagList
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminFlag:
  put:
    tags: [Admin]
    operationId: updateFeatureFlag
    summary: Change a flag default (reason required, audited)
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/FlagUpdate
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Flag
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
adminPayoutAccounts:
  get:
    tags: [Admin]
    operationId: listPayoutAccountsForReview
    summary: Payout accounts waiting for review, oldest first (default `PENDING`)
    description: Needs `admin.payments.view`.
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [PENDING, VERIFIED, FAILED]
      - $ref: ../common/parameters.yaml#/Cursor
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/PayoutAccountSummaryPage
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminPayoutAccountReveal:
  post:
    tags: [Admin]
    operationId: revealPayoutAccountNumber
    summary: The full account number, to check it against the bank's letter (step-up, audited)
    description: Needs `admin.payouts.approve` and a fresh code.
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/PayoutReveal
    responses:
      '200':
        description: The number.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AccountNumber
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
adminPayoutAccountDecision:
  post:
    tags: [Admin]
    operationId: decidePayoutAccount
    summary: Verify or reject a payout account (reason required, step-up, audited)
    description: |
      Needs `admin.payouts.approve` and a fresh code; staff cannot decide accounts of organizations they belong to.
      `REQUEST_INFO` is not used for accounts. Approving makes it the business's default account; the earlier one is retired.
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/Decision
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/PayoutAccountSummary
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
adminPayouts:
  get:
    tags: [Admin]
    operationId: listPayoutsForFinance
    summary: Seller payouts by queue, oldest first (default `APPROVAL`)
    description: Needs `admin.payments.view`.
    parameters:
      - name: queue
        in: query
        required: false
        schema:
          type: string
          enum: [APPROVAL, READY, PROCESSING, PAID, FAILED]
      - $ref: ../common/parameters.yaml#/Cursor
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/PayoutSummaryPage
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminPayoutDecision:
  post:
    tags: [Admin]
    operationId: decidePayout
    summary: Approve or reject a payout that waits for approval (reason required, step-up, audited)
    description: |
      Needs `admin.payouts.approve` and a fresh code; staff cannot handle payouts of organizations they belong to.
      Rejecting gives the money back to the business's available balance.
    parameters:
      - name: payoutId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/Decision
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/PayoutSummary
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
adminPayoutSettlement:
  post:
    tags: [Admin]
    operationId: settlePayout
    summary: Record what happened to a payout in the bank (step-up, audited)
    description: |
      Needs `admin.payouts.approve` and a fresh code. `PAID` needs the bank's reference; `FAILED` and `RETURNED` need a
      reason and give the money back to the business. A payout is paid from `SCHEDULED`, `APPROVED` or `PROCESSING`.
    parameters:
      - name: payoutId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/PayoutSettlement
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/PayoutSummary
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
adminPayoutExport:
  post:
    tags: [Admin]
    operationId: exportPayoutBatch
    summary: The bank batch (CSV with full account numbers) of the payouts ready to pay (step-up, audited)
    description: |
      Needs `admin.payouts.approve` and a fresh code. The exported payouts become `PROCESSING`. Payouts of organizations
      the staff member belongs to are left out.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/PayoutExport
    responses:
      '200':
        description: The CSV.
        content:
          text/csv:
            schema:
              type: string
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminRefunds:
  get:
    tags: [Admin]
    operationId: listRefundsForFinance
    summary: Refunds by queue, oldest first (default `PAY`)
    description: |
      Needs `admin.payments.view`. `APPROVAL`: duplicate payments waiting for a decision; `PAY`: approved refunds finance
      pays by hand, and ones the provider could not pay; `PROCESSING`: being paid through the provider; `PAID`.
    parameters:
      - name: queue
        in: query
        required: false
        schema:
          type: string
          enum: [APPROVAL, PAY, PROCESSING, PAID]
      - $ref: ../common/parameters.yaml#/Cursor
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/RefundSummaryPage
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminRefundApproval:
  post:
    tags: [Admin]
    operationId: approveRefund
    summary: Approve a refund that waits for a decision (step-up, audited)
    description: Needs `admin.payments.refund` and a fresh code.
    parameters:
      - name: refundId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/RefundApproval
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/RefundSummary
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
adminRefundPayment:
  post:
    tags: [Admin]
    operationId: payRefund
    summary: Record that a refund was paid to the customer by hand (step-up, audited)
    description: |
      Needs `admin.payments.refund` and a fresh code. The customer is told. A refund the provider is paying is refused
      (`CONFLICT`) unless the provider failed it.
    parameters:
      - name: refundId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/RefundPayment
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/RefundSummary
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict

