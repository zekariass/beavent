adminReviews:
  get:
    tags: [Admin]
    operationId: listReviewsForModeration
    summary: Reviews that businesses reported (default) or that staff took down, oldest first
    description: Needs `admin.moderation`, in the business's market.
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [REPORTED, HIDDEN]
      - $ref: ../common/parameters.yaml#/Cursor
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/StaffReviewPage
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminReviewDecision:
  post:
    tags: [Admin]
    operationId: decideReview
    summary: Hide a review, put it back, or dismiss the reports on it (reason required, audited)
    description: |
      Needs `admin.moderation`; staff cannot decide about a business they belong to. `HIDE` takes a published review
      down (it stops counting in the place's rating) and closes its reports as actioned; `RESTORE` puts a hidden review
      back; `DISMISS` closes the open reports and leaves the review. Each decision is recorded with its reason.
    parameters:
      - name: reviewId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/ReviewDecision
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/StaffReview
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
