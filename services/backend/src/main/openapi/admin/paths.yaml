      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
adminFlags:
  get:
    tags: [Admin]
    operationId: listFeatureFlags
    summary: Feature flags and their overrides
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/FlagList
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminFlag:
  put:
    tags: [Admin]
    operationId: updateFeatureFlag
    summary: Change a flag default (reason required, audited)
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/FlagUpdate
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Flag
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
adminPayoutAccounts:
  get:
    tags: [Admin]
    operationId: listPayoutAccountsForReview
    summary: Payout accounts waiting for review, oldest first (default `PENDING`)
    description: Needs `admin.payments.view`.
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [PENDING, VERIFIED, FAILED]
      - $ref: ../common/parameters.yaml#/Cursor
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/PayoutAccountSummaryPage
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminPayoutAccountReveal:
  post:
    tags: [Admin]
    operationId: revealPayoutAccountNumber
    summary: The full account number, to check it against the bank's letter (step-up, audited)
    description: Needs `admin.payouts.approve` and a fresh code.
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/PayoutReveal
    responses:
      '200':
        description: The number.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AccountNumber
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
adminPayoutAccountDecision:
  post:
    tags: [Admin]
    operationId: decidePayoutAccount
    summary: Verify or reject a payout account (reason required, step-up, audited)
    description: |
      Needs `admin.payouts.approve` and a fresh code; staff cannot decide accounts of organizations they belong to.
      `REQUEST_INFO` is not used for accounts. Approving makes it the business's default account; the earlier one is retired.
    parameters:
      - name: accountId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/Decision
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/PayoutAccountSummary
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
adminPayouts:
  get:
    tags: [Admin]
    operationId: listPayoutsForFinance
    summary: Seller payouts by queue, oldest first (default `APPROVAL`)
    description: Needs `admin.payments.view`.
    parameters:
      - name: queue
        in: query
        required: false
        schema:
          type: string
          enum: [APPROVAL, READY, PROCESSING, PAID, FAILED]
      - $ref: ../common/parameters.yaml#/Cursor
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/PayoutSummaryPage
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminPayoutDecision:
  post:
    tags: [Admin]
    operationId: decidePayout
    summary: Approve or reject a payout that waits for approval (reason required, step-up, audited)
    description: |
      Needs `admin.payouts.approve` and a fresh code; staff cannot handle payouts of organizations they belong to.
      Rejecting gives the money back to the business's available balance.
    parameters:
      - name: payoutId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/Decision
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/PayoutSummary
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
adminPayoutSettlement:
  post:
    tags: [Admin]
    operationId: settlePayout
    summary: Record what happened to a payout in the bank (step-up, audited)
    description: |
      Needs `admin.payouts.approve` and a fresh code. `PAID` needs the bank's reference; `FAILED` and `RETURNED` need a
      reason and give the money back to the business. A payout is paid from `SCHEDULED`, `APPROVED` or `PROCESSING`.
    parameters:
      - name: payoutId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/PayoutSettlement
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/PayoutSummary
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
adminPayoutExport:
  post:
    tags: [Admin]
    operationId: exportPayoutBatch
    summary: The bank batch (CSV with full account numbers) of the payouts ready to pay (step-up, audited)
    description: |
      Needs `admin.payouts.approve` and a fresh code. The exported payouts become `PROCESSING`. Payouts of organizations
      the staff member belongs to are left out.
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/PayoutExport
    responses:
      '200':
        description: The CSV.
        content:
          text/csv:
            schema:
              type: string
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminRefunds:
  get:
    tags: [Admin]
    operationId: listRefundsForFinance
    summary: Refunds by queue, oldest first (default `PAY`)
    description: |
      Needs `admin.payments.view`. `APPROVAL`: duplicate payments waiting for a decision; `PAY`: approved refunds finance
      pays by hand, and ones the provider could not pay; `PROCESSING`: being paid through the provider; `PAID`.
    parameters:
      - name: queue
        in: query
        required: false
        schema:
          type: string
          enum: [APPROVAL, PAY, PROCESSING, PAID]
      - $ref: ../common/parameters.yaml#/Cursor
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/RefundSummaryPage
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminRefundApproval:
  post:
    tags: [Admin]
    operationId: approveRefund
    summary: Approve a refund that waits for a decision (step-up, audited)
    description: Needs `admin.payments.refund` and a fresh code.
    parameters:
      - name: refundId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/RefundApproval
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/RefundSummary
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
adminRefundPayment:
  post:
    tags: [Admin]
    operationId: payRefund
    summary: Record that a refund was paid to the customer by hand (step-up, audited)
    description: |
      Needs `admin.payments.refund` and a fresh code. The customer is told. A refund the provider is paying is refused
      (`CONFLICT`) unless the provider failed it.
    parameters:
      - name: refundId
        in: path
        required: true
        schema:
          $ref: ../common/schemas.yaml#/Uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/RefundPayment
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/RefundSummary
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict

adminReconciliationAccounts:
  get:
    tags: [Admin]
    operationId: listReconciliationAccounts
    summary: The provider accounts a statement can be uploaded for
    description: Needs `admin.reconciliation`.
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/ReconciliationAccountList
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminReconciliationStatements:
  get:
    tags: [Admin]
    operationId: listProviderStatements
    summary: Imported statements, latest period first
    description: Needs `admin.reconciliation`.
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/StatementList
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
  post:
    tags: [Admin]
    operationId: importProviderStatement
    summary: Import a provider statement and match it (audited)
    description: |
      Needs `admin.reconciliation`. Each line is matched to our payments, refunds and payouts by reference and amount; the
      provider's fees are posted to the ledger; money nothing explains is held in suspense. `CONFLICT` when the days
      overlap a statement imported before; `VALIDATION_FAILED` names the line of a file that cannot be read.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/StatementUpload
    responses:
      '201':
        description: Imported and matched.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/Statement
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
      '409':
        $ref: ../common/responses.yaml#/Conflict
adminReconciliationExceptions:
  get:
    tags: [Admin]
    operationId: listReconciliationExceptions
    summary: What finance still has to explain
    description: Needs `admin.reconciliation`. Oldest first, at most 200.
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/ReconciliationExceptionList
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminReconciliationResolutions:
  post:
    tags: [Admin]
    operationId: resolveReconciliationException
    summary: Say why an exception is fine (audited)
    description: Needs `admin.reconciliation`. The note is kept with who wrote it.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/ExceptionResolution
    responses:
      '204':
        $ref: ../common/responses.yaml#/NoContent
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '404':
        $ref: ../common/responses.yaml#/NotFound
adminPaymentProvider:
  get:
    tags: [Admin]
    operationId: getPaymentProviderCertification
    summary: The active provider's status and what stands between it and going live
    description: Needs `admin.reconciliation`.
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/ProviderCertification
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminPaymentProviderGoLive:
  post:
    tags: [Admin]
    operationId: goLivePaymentProvider
    summary: Make the active provider live once every check passes (step-up, audited)
    description: Needs `admin.reconciliation` and a fresh code. `CONFLICT` while a check fails.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/GoLive
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/ProviderCertification
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
      '409':
        $ref: ../common/responses.yaml#/Conflict
adminPaymentProviderSuspension:
  post:
    tags: [Admin]
    operationId: suspendPaymentProvider
    summary: Stop taking new online payments through the active provider (step-up, audited)
    description: Needs `admin.reconciliation` and a fresh code.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/ProviderSuspension
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/ProviderCertification
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden
adminMarketplaceListings:
  get:
    tags: [Admin]
    operationId: listMarketplaceListings
    summary: Businesses by their place on the marketplace, oldest first (default `PENDING_REVIEW`)
    description: Needs `admin.marketplace.review`, in the business's market.
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [HIDDEN, PENDING_REVIEW, LISTED, DELISTED]
      - $ref: ../common/parameters.yaml#/Cursor
      - $ref: ../common/parameters.yaml#/Limit
    responses:
      '200':
        description: OK.
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/MarketplaceListingPage
      '400':
        $ref: ../common/responses.yaml#/BadRequest
      '401':
        $ref: ../common/responses.yaml#/Unauthorized
      '403':
        $ref: ../common/responses.yaml#/Forbidden

adminMarketplaceDecision:
  post:
    tags: [Admin]
    operationId: decideMarketplace
    summary: List a business on the marketplace, send its request back, or take it off (reason required, audited)
    description: |
      Needs `admin.marketplace.review`; staff cannot decide about a business they belong to. `LIST` needs an active
      location and a service people can book online (`CONSTRAINT_VIOLATION`) and a business that is not suspended,
      restricted or closed; `REJECT` answers a waiting request; `DELIST` takes a listed business off. The reason is shown
      to the business after `REJECT` and `DELIST`. The business is in or out of search right away.
    parameters:
      - $ref: ../common/parameters.yaml#/OrgId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/MarketplaceDecision
