CashDrawerMovement:
  type: object
  required: [id, kind, amountMinor, at, byUserId]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    kind:
      type: string
      enum: [SALE, REFUND, PAY_IN, PAY_OUT, DROP, CORRECTION]
    amountMinor:
      type: integer
      format: int64
      description: Signed; plus into the drawer.
    note:
      type: [string, 'null']
    at:
      $ref: ../common/schemas.yaml#/Instant
    byUserId:
      $ref: ../common/schemas.yaml#/Uuid
CashDrawerSession:
  type: object
  required:
    [id, locationId, drawerName, currency, status, openedAt, openedBy, openingFloatMinor, salesMinor, payInMinor,
     payOutMinor, expectedMinor, movements]
  properties:
    id:
      $ref: ../common/schemas.yaml#/Uuid
    locationId:
      $ref: ../common/schemas.yaml#/Uuid
    drawerName:
      type: string
    currency:
      type: string
    status:
      type: string
      enum: [OPEN, CLOSED, RECONCILED]
    openedAt:
      $ref: ../common/schemas.yaml#/Instant
    openedBy:
      $ref: ../common/schemas.yaml#/Uuid
    openingFloatMinor:
      type: integer
      format: int64
    salesMinor:
      type: integer
      format: int64
    payInMinor:
      type: integer
      format: int64
    payOutMinor:
      type: integer
      format: int64
      description: Taken out for expenses and to the safe, as a positive amount.
    expectedMinor:
      type: integer
      format: int64
      description: What should be in the drawer; once closed, what was expected when it closed.
    countedMinor:
      type: [integer, 'null']
      format: int64
    varianceMinor:
      type: [integer, 'null']
      format: int64
      description: Counted less expected; negative when cash is missing.
    closedAt:
      oneOf:
        - $ref: ../common/schemas.yaml#/Instant
        - type: 'null'
    movements:
      type: array
      description: Newest first; empty in the history listing.
      items:
        $ref: '#/CashDrawerMovement'
CashDrawerState:
  type: object
  required: [history]
  properties:
    session:
      oneOf:
        - $ref: '#/CashDrawerSession'
        - type: 'null'
    history:
      type: array
      items:
        $ref: '#/CashDrawerSession'
CashDrawerOpen:
  type: object
  required: [locationId, openingFloatMinor]
  properties:
    locationId:
      $ref: ../common/schemas.yaml#/Uuid
    openingFloatMinor:
      type: integer
      format: int64
      minimum: 0
CashDrawerMovementInput:
  type: object
  required: [kind, amountMinor]
  properties:
    kind:
      type: string
      enum: [PAY_IN, PAY_OUT, DROP]
    amountMinor:
      type: integer
      format: int64
      minimum: 1
    note:
      type: string
      maxLength: 200
CashDrawerClose:
  type: object
  required: [countedMinor]
  properties:
    countedMinor:
      type: integer
      format: int64
      minimum: 0
CheckoutBill:
  type: object
  required:
    [appointmentId, locationId, reference, status, currency, lines, totalMinor, paidMinor, dueMinor, team, drawerOpen,
     canCheckout, balanceMinor, canDiscount, tenders]
  properties:
    appointmentId:
      $ref: ../common/schemas.yaml#/Uuid
    locationId:
      $ref: ../common/schemas.yaml#/Uuid
    orderId:
      oneOf:
        - $ref: ../common/schemas.yaml#/Uuid
        - type: 'null'
      description: The visit's order, once it has one (the receipt is the order's).
    reference:
      type: string
    status:
      type: string
    customerName:
      type: [string, 'null']
    currency:
      type: string
    lines:
      type: array
      items:
        type: object
        required: [description, totalMinor]
        properties:
          description:
            type: string
          totalMinor:
            type: integer
            format: int64
    totalMinor:
      type: integer
      format: int64
    paidMinor:
      type: integer
      format: int64
      description: Already paid online (a deposit).
    dueMinor:
      type: integer
      format: int64
      description: Still to pay at the counter, before any tip.
    team:
      type: array
      description: Who worked on the visit; a tip can go to each.
      items:
        type: object
        required: [staffId, name]
        properties:
          staffId:
            $ref: ../common/schemas.yaml#/Uuid
          name:
            type: string
    drawerOpen:
      type: boolean
    canCheckout:
      type: boolean
    receiptNumber:
      type: [string, 'null']
    balanceMinor:
      type: integer
      format: int64
      description: What the customer has in their balance with the business.
    canDiscount:
      type: boolean
      description: A discount can be given (the visit has no order yet and the caller holds `pos.discount`).
    tenders:
      type: array
      description: Paid at the counter so far (a sale that was started and not finished).
      items:
        $ref: '#/CheckoutTender'
CheckoutTender:
  type: object
  required: [method, amountMinor]
  properties:
    method:
      type: string
      enum: [GIFT_CARD, STORE_CREDIT, CASH]
    amountMinor:
      type: integer
      format: int64
CheckoutInput:
  type: object
  properties:
    tips:
      type: array
      items:
        type: object
        required: [staffId, amountMinor]
        properties:
          staffId:
            $ref: ../common/schemas.yaml#/Uuid
          amountMinor:
            type: integer
            format: int64
            minimum: 0
    discount:
      type: object
      description: |
        Needs `pos.discount`; only on a visit that has no order yet. Shared between the services in proportion to their price.
      required: [kind, value, reason]
      properties:
        kind:
          type: string
          enum: [AMOUNT, PERCENT]
        value:
          type: integer
          format: int64
          minimum: 1
          description: Minor units for AMOUNT; 1 to 100 for PERCENT.
        reason:
          type: string
          minLength: 3
          maxLength: 200
    giftCards:
      type: array
      description: Codes, in the order to use them; each pays as much as is due.
      items:
        type: string
        maxLength: 40
    useBalance:
      type: boolean
      description: Use the customer's balance with the business (after any gift cards).
    cashTenderedMinor:
      type: integer
      format: int64
      minimum: 0
      description: The cash handed over for what the cards and balance did not pay. Omit for exactly what is due.
CheckoutDone:
  type: object
  required:
    [orderId, orderNumber, receiptNumber, currency, totalMinor, paidOnlineMinor, tipMinor, cashMinor, tenderedMinor, changeMinor,
     discountMinor, tenders]
  properties:
    orderId:
      $ref: ../common/schemas.yaml#/Uuid
    orderNumber:
      type: string
    receiptNumber:
      type: string
    currency:
      type: string
    totalMinor:
      type: integer
      format: int64
    paidOnlineMinor:
      type: integer
      format: int64
    tipMinor:
      type: integer
      format: int64
    cashMinor:
      type: integer
      format: int64
      description: What stays in the drawer.
    tenderedMinor:
      type: integer
      format: int64
    changeMinor:
      type: integer
      format: int64
    discountMinor:
      type: integer
      format: int64
    tenders:
      type: array
      items:
        $ref: '#/CheckoutTender'
ReceiptView:
  type: object
  required:
    [number, issuedAt, orderNumber, currency, timezone, business, pricesIncludeTax, lines, subtotalMinor, discountMinor,
     taxMinor, totalMinor, taxes, tenders]
  properties:
    number:
      type: string
    issuedAt:
      $ref: ../common/schemas.yaml#/Instant
    orderNumber:
      type: string
    currency:
      type: string
    timezone:
      type: string
    business:
      type: string
      description: The legal entity's registered name.
    tin:
      type: [string, 'null']
    location:
      type: [string, 'null']
    landmark:
      type: [string, 'null']
    phone:
      type: [string, 'null']
    customer:
      type: [string, 'null']
    pricesIncludeTax:
      type: boolean
    lines:
      type: array
      items:
        type: object
        required: [type, description, quantity, unitMinor, discountMinor, totalMinor]
        properties:
          type:
            type: string
          description:
            type: string
          quantity:
            type: integer
          unitMinor:
            type: integer
            format: int64
          discountMinor:
            type: integer
            format: int64
          totalMinor:
            type: integer
            format: int64
    subtotalMinor:
      type: integer
      format: int64
    discountMinor:
      type: integer
      format: int64
    taxMinor:
      type: integer
      format: int64
    totalMinor:
      type: integer
      format: int64
    taxes:
      type: array
      items:
        type: object
        required: [code, rate, taxableMinor, taxMinor]
        properties:
          code:
            type: string
          rate:
            type: number
          taxableMinor:
            type: integer
            format: int64
          taxMinor:
            type: integer
            format: int64
    tenders:
      type: array
      items:
        type: object
        required: [method, name, amountMinor]
        properties:
          method:
            type: string
          name:
            type: string
          amountMinor:
            type: integer
            format: int64
          at:
            oneOf:
              - $ref: ../common/schemas.yaml#/Instant
              - type: 'null'
ReceiptSent:
  type: object
  required: [via]
  properties:
    via:
      type: string
      enum: [SMS, EMAIL]
