# Local development and tests: docker compose services (see repository README). Never use in staging/production.
spring.datasource.url=jdbc:postgresql://localhost:5433/beavent
spring.datasource.username=beavent
spring.datasource.password=beavent
# Also runs db/local/afterMigrate__local_login_roles.sql, which creates the role logins below.
spring.flyway.locations=classpath:db/migration,classpath:db/local

beavent.db.app.username=beavent_app_login
beavent.db.app.password=beavent_app
beavent.db.identity.username=beavent_identity_login
beavent.db.identity.password=beavent_identity
beavent.db.system.username=beavent_system_login
beavent.db.system.password=beavent_system

spring.rabbitmq.host=localhost
spring.rabbitmq.username=beavent
spring.rabbitmq.password=beavent
spring.data.redis.host=localhost

management.tracing.sampling.probability=1.0

# Identity (local only): fixed development secret, throwaway JWT key, codes written to the log.
beavent.auth.secret-key=YmVhdmVudC1sb2NhbC1kZXZlbG9wbWVudC1zZWNyZXQta2V5LTAx
beavent.auth.jwt.allow-ephemeral-key=true
beavent.sms.provider=log
beavent.email.provider=log
beavent.tenancy.partner-portal-url=http://localhost:3000/business

# Files: SeaweedFS from docker-compose; buckets (and public-read on the public bucket) are created at startup.
beavent.files.endpoint=http://localhost:8333
beavent.files.region=us-east-1
beavent.files.access-key=beavent
beavent.files.secret-key=beavent-dev-secret
beavent.files.private-bucket=beavent-private
beavent.files.public-bucket=beavent-public
beavent.files.public-base-url=http://localhost:8333/beavent-public
beavent.files.create-buckets=true
beavent.files.scanner=eicar

# Expo web (mobile app in a browser) during development.
beavent.web.allowed-origins=http://localhost:8081,http://localhost:19006,http://localhost:19007

# Local development and e2e: every request comes from one address.
beavent.booking.holds-per-ip-per-hour=100000
beavent.auth.otp.per-ip-per-hour=100000
