# Runs on every pull request and on pushes to main. Each job mirrors a local command (see README).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: JS apps and packages (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run format:check
      - run: npx turbo run lint typecheck test build

  api-contract:
    name: API contract (lint, generated client up to date, breaking changes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run api:spec
      - name: Generated client matches the spec (run `npm run api:spec` and commit)
        run: git diff --exit-code -- packages/api-client
      - name: No breaking changes against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git cat-file -e "origin/${BASE_REF}:packages/api-client/openapi.yaml" 2>/dev/null; then
            mkdir -p /tmp/base
            git show "origin/${BASE_REF}:packages/api-client/openapi.yaml" > /tmp/base/openapi.yaml
            docker run --rm -v /tmp/base:/base -v "$PWD/packages/api-client:/head" tufin/oasdiff:v1.35.0 \
              breaking /base/openapi.yaml /head/openapi.yaml --fail-on ERR
          else
            echo "Base branch has no API contract yet; nothing to compare."
          fi

  backend:
    name: Backend (format, compile, tests incl. Flyway on PostGIS and module boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/build/reports/tests

  database:
    name: Database baseline (migrations, invariant tests, race test on PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: db/scripts/validate.sh --docker

  images:
    name: Container image (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, file: backend/Dockerfile, context: ., app: "" }
          - {
              name: chapa-stub,
              file: tools/chapa-stub/Dockerfile,
              context: tools/chapa-stub,
              app: "",
            }
          - { name: web, file: docker/next-app.Dockerfile, context: ., app: web }
          - { name: business, file: docker/next-app.Dockerfile, context: ., app: business }
          - {
              name: admin-console,
              file: docker/next-app.Dockerfile,
              context: .,
              app: admin-console,
            }
    steps:
      - uses: actions/checkout@v7
      # The backend image packages a jar built by Gradle (jOOQ code generation needs Docker, so it runs here).
      - if: matrix.name == 'api'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.name == 'api'
        uses: gradle/actions/setup-gradle@v6
      - if: matrix.name == 'api'
        run: ./gradlew bootJar --console=plain
        working-directory: backend
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.app && format('APP={0}', matrix.app) || '' }}
          push: false
          tags: beavent-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
